// ═══════════ PERSISTENCE ═══════════
function saveSubmissions() {
  var toSave = state.submissions.map(function(s) {
    var sc = {id:s.id,attId:s.attId,teamId:s.teamId,at:s.at,status:s.status,
              aiReview:s.aiReview,manualReview:s.manualReview,versions:s.versions||[],responses:{}};
    Object.keys(s.responses).forEach(function(k){
      sc.responses[k] = {text:s.responses[k].text,files:[],subChecks:s.responses[k].subChecks||{}};
    });
    return sc;
  });
  try { localStorage.setItem('attesthub_submissions',JSON.stringify(toSave)); } catch(e) {}
}

function loadSubmissions() {
  try {
    var raw = localStorage.getItem('attesthub_submissions');
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function saveAttestations() {
  try { localStorage.setItem('attesthub_attestations',JSON.stringify(state.attestations)); } catch(e) {}
}
function loadAttestations() {
  try { var r=localStorage.getItem('attesthub_attestations'); return r?JSON.parse(r):null; } catch(e) { return null; }
}
function saveUsers() {
  try { localStorage.setItem('attesthub_users',JSON.stringify(state.users)); } catch(e) {}
}
function loadUsers() {
  try { var r=localStorage.getItem('attesthub_users'); return r?JSON.parse(r):null; } catch(e) { return null; }
}

function initState() {
  var savedAtts = loadAttestations();
  if (savedAtts && savedAtts.length > 0) state.attestations = savedAtts;
  var savedUsers = loadUsers();
  if (savedUsers && savedUsers.length > 0) state.users = savedUsers;

  var saved = loadSubmissions();
  if (saved && saved.length > 0) {
    state.submissions = saved;
    state.submissions.forEach(function(s) {
      if (!s.aiReview) {
        var att = state.attestations.find(function(a){ return a.id === s.attId; });
        if (att) s.aiReview = runAI(s, att, s.teamId);
      }
    });
  } else {
    state.submissions[0].aiReview = runAI(state.submissions[0], state.attestations[0], state.submissions[0].teamId);
  }
}

// ═══════════ AI REVIEW ENGINE ═══════════
function teamChecklist(att, teamId) {
  if (!teamId) return att.checklist;
  return att.checklist.filter(function(ci) {
    return !ci.teams || ci.teams.length===0 || ci.teams.indexOf(teamId)>=0;
  });
}

function runAI(sub, att, teamId) {
  var checklist = teamChecklist(att, teamId);
  var itemComments = {};
  var compPts=0, qualPts=0, shotPts=0, shotReq=0;
  checklist.forEach(function(ci) {
    var r = sub.responses[ci.id] || {text:'',files:[]};
    var words = r.text.trim() ? r.text.trim().split(/\s+/).length : 0;
    var hasText = words > 0;
    var hasGood = words >= 40;
    var hasShot = r.files.length > 0;
    var c = [];

    if (ci.req) {
      var ok = (ci.type==='text' && hasText) || (ci.type==='screenshot' && hasShot) || (ci.type==='both' && (hasText||hasShot));
      if (ok) compPts++;
      else if (hasText && !hasGood) { compPts+=0.4; c.push({t:'warn',m:'Response is too brief — auditors expect specific dates, metrics, and outcomes.'}); }
      else c.push({t:'error',m:'No response provided for this required item.'});
    }

    if (hasText) {
      if (hasGood) qualPts++;
      else if (words>=15) { qualPts+=0.6; c.push({t:'info',m:'Short response ('+words+' words). Consider adding more detail.'}); }
      else { qualPts+=0.2; c.push({t:'warn',m:'Very brief ('+words+' words) — unlikely to satisfy an auditor.'}); }
    } else if (!ci.req) {
      c.push({t:'info',m:'Optional item — no response provided.'});
    }

    if (ci.type==='both'||ci.type==='screenshot') {
      shotReq++;
      if (hasShot) { shotPts++; c.push({t:'ok',m:'Screenshot uploaded. Ensure it clearly shows relevant evidence.'}); }
      else if (ci.type==='screenshot') c.push({t:'error',m:'Screenshot required but not uploaded.'});
      else c.push({t:'info',m:'Screenshot recommended to support the text response.'});
    }
    itemComments[ci.id] = c;
  });

  var reqN = checklist.filter(function(i){return i.req}).length || 1;
  var comp = Math.round((compPts/reqN)*100);
  var qual = Math.round((qualPts/checklist.length)*100);
  var shot = shotReq>0 ? Math.round((shotPts/shotReq)*100) : 100;
  var overall = Math.round(comp*0.45 + qual*0.35 + shot*0.2);

  var label,color,comment;
  if (overall>=85) { label='Excellent'; color='#16a34a'; comment='Comprehensive and well-evidenced. Recommended for manual approval.'; }
  else if (overall>=65) { label='Good'; color='#2563eb'; comment='Largely complete with minor gaps. A few improvements recommended.'; }
  else if (overall>=45) { label='Needs Improvement'; color='#d97706'; comment='Several items need additional evidence or more detail.'; }
  else { label='Poor'; color='#dc2626'; comment='Significantly incomplete. Multiple required items missing.'; }

  return {comp:comp,qual:qual,shot:shot,overall:overall,label:label,color:color,comment:comment,items:itemComments};
}

// ═══════════ AUDIT TRAIL ═══════════
function createVersionEntry(existingSub, newResponses, att, user) {
  var changes = [];
  var prev = (existingSub && existingSub.responses) ? existingSub.responses : {};
  att.checklist.forEach(function(ci) {
    var oldR = prev[ci.id] || {text:'',subChecks:{}};
    var newR = newResponses[ci.id] || {text:'',subChecks:{}};
    if ((oldR.text||'') !== (newR.text||'')) {
      changes.push({ciId:ci.id,ciTitle:ci.title,field:'Text response',
        from:oldR.text||'(empty)',to:newR.text||'(empty)',at:new Date().toISOString(),by:user.name});
    }
    var allSi = {};
    Object.keys(oldR.subChecks||{}).forEach(function(k){allSi[k]=true;});
    Object.keys(newR.subChecks||{}).forEach(function(k){allSi[k]=true;});
    Object.keys(allSi).forEach(function(siId){
      var oldV = !!(oldR.subChecks&&oldR.subChecks[siId]);
      var newV = !!(newR.subChecks&&newR.subChecks[siId]);
      if (oldV !== newV) {
        var siLabel = siId;
        (ci.subItems||[]).forEach(function(si){if(si.id===siId)siLabel=si.text;});
        changes.push({ciId:ci.id,ciTitle:ci.title,field:'Compliance: '+siLabel,
          from:oldV?'Checked':'Unchecked',to:newV?'Checked':'Unchecked',at:new Date().toISOString(),by:user.name});
      }
    });
  });
  var prevVersions = existingSub ? (existingSub.versions||[]) : [];
  return {
    vNum: prevVersions.length + 1,
    savedAt: new Date().toISOString(),
    savedBy: user.name,
    status: 'submitted',
    snapshot: JSON.parse(JSON.stringify(newResponses)),
    changes: changes
  };
}

function fmtDateTime(iso) {
  var d = new Date(iso);
  return d.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}) + ' ' +
    d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});
}

// ═══════════ STATUS HELPERS ═══════════
function getAttStatus(att) {
  var now = new Date();
  var due = new Date(att.due);
  var days = Math.ceil((due-now)/86400000);
  var subs = att.teams.map(function(tid) {
    return state.submissions.find(function(s){return s.attId===att.id && s.teamId===tid && s.status!=='draft'});
  });
  var submitted = subs.filter(Boolean).length;
  var approved = subs.filter(function(s){return s&&s.status==='approved'}).length;
  var rejected = subs.filter(function(s){return s&&s.status==='rejected'}).length;
  var missing = att.teams.length - submitted;

  if (approved===att.teams.length && att.teams.length>0) return {badge:'Complete',color:'#16a34a',bg:'#dcfce7',days:days};
  if (days<0 && missing>0) return {badge:'Overdue',color:'#dc2626',bg:'#fee2e2',days:days};
  if (days<=14 && missing>0) return {badge:'At Risk',color:'#dc2626',bg:'#fee2e2',days:days};
  if (rejected>0) return {badge:'Issues',color:'#ea580c',bg:'#ffedd5',days:days};
  if (submitted>0) return {badge:'In Progress',color:'#7A5F00',bg:'#FFF9C4',days:days};
  return {badge:'Not Started',color:'#6b7280',bg:'#f3f4f6',days:days};
}

function getTeamSub(attId, teamId) {
  return state.submissions.find(function(s){return s.attId===attId && s.teamId===teamId});

function fmtDate(d) { return new Date(d).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}); }

// ═══════════ RENDER ENGINE ═══════════
function h(tag, attrs, children) {
  var el = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k) {
    if (k === 'style' && typeof attrs[k] === 'object') {
      Object.keys(attrs[k]).forEach(function(s){ el.style[s] = attrs[k][s]; });
    } else if (k.indexOf('on')===0) {
      el.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    } else if (k === 'className') {
      el.className = attrs[k];
    } else if (k === 'value') {
      el.value = attrs[k];
    } else if (k === 'placeholder') {
      el.placeholder = attrs[k];
    } else if (k === 'type') {
      el.type = attrs[k];
    } else if (k === 'checked') {
      el.checked = attrs[k];
    } else if (k === 'htmlFor') {
      el.htmlFor = attrs[k];
    } else if (k === 'multiple') {
      el.multiple = attrs[k];
    } else if (k === 'accept') {
      el.accept = attrs[k];
    } else if (k === 'disabled') {
      el.disabled = attrs[k];
    } else if (k === 'selected') {
      el.selected = attrs[k];
    } else if (k === 'src') {
      el.src = attrs[k];
    } else {
      el.setAttribute(k, attrs[k]);
    }
  });
  if (children !== undefined && children !== null) {
    if (Array.isArray(children)) {
      children.forEach(function(c) {
        if (c === null || c === undefined) return;
        if (typeof c === 'string' || typeof c === 'number') el.appendChild(document.createTextNode(c));
        else el.appendChild(c);
      });
    } else if (typeof children === 'string' || typeof children === 'number') {
      el.appendChild(document.createTextNode(children));
    } else {
      el.appendChild(children);
    }
  }
  return el;
}

    wrap.appendChild(h('p',{style:{fontSize:'13px',color:'#64748b',marginBottom:'24px'}},'Submit evidence for your assigned attestations.'));
  }

  // Summary cards + charts for admin
  if (!isCrew) {
    var total=myAtts.length, atRisk=0, inProg=0, done=0, notStarted=0;
    myAtts.forEach(function(a){var s=getAttStatus(a); if(s.badge==='At Risk'||s.badge==='Overdue')atRisk++; else if(s.badge==='In Progress'||s.badge==='Under Review')inProg++; else if(s.badge==='Complete')done++; else notStarted++;});
    // Enhanced stat cards with mini progress bars
    var stats = h('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'12px',marginBottom:'24px'}});
    [{l:'Total',v:total,c:'#334155',bg:'#fff',bar:'#334155'},{l:'At Risk',v:atRisk,c:'#dc2626',bg:'#fef2f2',bar:'#dc2626'},{l:'In Progress',v:inProg,c:'#7A5F00',bg:'#FFFDE7',bar:'#FFD000'},{l:'Complete',v:done,c:'#16a34a',bg:'#f0fdf4',bar:'#16a34a'}].forEach(function(s){
      var pct = total>0?Math.round(s.v/total*100):0;
      var card2 = h('div',{style:{background:s.bg,borderRadius:'12px',padding:'16px',border:'1px solid #f1f5f9'}});
      card2.appendChild(h('div',{style:{fontSize:'28px',fontWeight:'700',color:s.c,lineHeight:'1'}},String(s.v)));
      card2.appendChild(h('div',{style:{fontSize:'13px',color:'#64748b',marginTop:'2px',marginBottom:'10px'}},s.l));
      card2.appendChild(h('div',{style:{fontSize:'10px',color:'#94a3b8',marginBottom:'4px'}},pct+'% of total'));
      var track = h('div',{style:{height:'3px',background:'#e2e8f0',borderRadius:'99px',overflow:'hidden'}});
      track.appendChild(h('div',{style:{height:'100%',width:pct+'%',background:s.bar,borderRadius:'99px'}}));
      card2.appendChild(track);
      stats.appendChild(card2);
    });
    wrap.appendChild(stats);

    // Viz row: donut + bar chart
    var vizRow = h('div',{style:{display:'flex',gap:'16px',marginBottom:'20px'}});

    // Donut chart (SVG via innerHTML)
    var donutCard = h('div',{style:{background:'#fff',borderRadius:'12px',border:'1px solid #f1f5f9',padding:'20px',flex:'0 0 260px'}});
    donutCard.appendChild(h('p',{style:{fontSize:'11px',fontWeight:'700',color:'#94a3b8',letterSpacing:'0.5px',marginBottom:'12px'}},'STATUS BREAKDOWN'));
    var circ = 2*Math.PI*40;
    var segs = [{l:'Complete',v:done,c:'#16a34a'},{l:'In Progress',v:inProg,c:'#FFD000'},{l:'At Risk',v:atRisk,c:'#dc2626'},{l:'Not Started',v:notStarted,c:'#cbd5e1'}];
    var svgSegs = '';
    var offset = 0;
    segs.forEach(function(seg){
      var dash = total>0?(seg.v/total)*circ:0;
      var gap = circ-dash;
      svgSegs += '<circle cx="56" cy="56" r="40" fill="none" stroke="'+seg.c+'" stroke-width="18" stroke-dasharray="'+dash.toFixed(2)+' '+gap.toFixed(2)+'" stroke-dashoffset="'+(-offset).toFixed(2)+'" transform="rotate(-90 56 56)"/>';
      offset += dash;
    });
    var donutInner = h('div',{style:{display:'flex',alignItems:'center',gap:'16px'}});
    var svgWrap = h('div',{});
    svgWrap.innerHTML = '<svg width="112" height="112" viewBox="0 0 112 112">'+svgSegs+'<text x="56" y="52" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">'+total+'</text><text x="56" y="66" text-anchor="middle" font-size="10" fill="#94a3b8">total</text></svg>';
    donutInner.appendChild(svgWrap);
    var legend = h('div',{});
    segs.forEach(function(seg){
      var ll = h('div',{style:{display:'flex',alignItems:'center',gap:'6px',fontSize:'11px',color:'#475569',marginBottom:'6px'}});
      ll.appendChild(h('span',{style:{width:'10px',height:'10px',borderRadius:'50%',background:seg.c,flexShrink:'0'}}));
      ll.appendChild(document.createTextNode(seg.l+' ('+seg.v+')'));
      legend.appendChild(ll);
    });
    donutInner.appendChild(legend);
    donutCard.appendChild(donutInner);
    vizRow.appendChild(donutCard);

    // Bar chart — AI scores per submission
    var barCard = h('div',{style:{background:'#fff',borderRadius:'12px',border:'1px solid #f1f5f9',padding:'20px',flex:'1'}});
    barCard.appendChild(h('p',{style:{fontSize:'11px',fontWeight:'700',color:'#94a3b8',letterSpacing:'0.5px',marginBottom:'12px'}},'AI SCORES BY TEAM'));
    var scoreSubs = state.submissions.filter(function(s){return s.aiReview;}).slice(0,5);
    if (scoreSubs.length===0) {
      barCard.appendChild(h('p',{style:{fontSize:'12px',color:'#94a3b8',padding:'16px 0'}},'No AI-reviewed submissions yet.'));
    } else {
      var barH = scoreSubs.length*44+30;
      var barRows = '';
      scoreSubs.forEach(function(s,idx){
        var team2 = state.users.find(function(u){return u.id===s.teamId;});
        var tn = team2?team2.name.split(' ')[0]:s.teamId;
        var ai2 = s.aiReview;
        var y = idx*44+16;
        var compW = (ai2.comp/100)*160*0.45;
        var qualW = (ai2.qual/100)*160*0.35;
        var shotW = (ai2.shot/100)*160*0.20;
        barRows += '<text x="0" y="'+(y+10)+'" font-size="11" fill="#475569">'+tn+'</text>';
        barRows += '<rect x="80" y="'+y+'" width="160" height="14" rx="3" fill="#f1f5f9"/>';
        barRows += '<rect x="80" y="'+y+'" width="'+compW.toFixed(1)+'" height="14" rx="3" fill="#16a34a"/>';
        barRows += '<rect x="'+(80+compW).toFixed(1)+'" y="'+y+'" width="'+qualW.toFixed(1)+'" height="14" rx="3" fill="#FFD000"/>';
        barRows += '<rect x="'+(80+compW+qualW).toFixed(1)+'" y="'+y+'" width="'+shotW.toFixed(1)+'" height="14" rx="3" fill="#d97706"/>';
        barRows += '<text x="250" y="'+(y+10)+'" font-size="11" font-weight="600" fill="#1e293b">'+ai2.overall+'%</text>';
      });
      var barWrap = h('div',{});
      barWrap.innerHTML = '<svg width="100%" height="'+barH+'" viewBox="0 0 280 '+barH+'">'+barRows+'</svg>';
      barCard.appendChild(barWrap);
      // Legend
      var blgd = h('div',{style:{display:'flex',gap:'12px',marginTop:'8px'}});
      [{c:'#16a34a',l:'Completeness'},{c:'#FFD000',l:'Quality'},{c:'#ea580c',l:'Screenshots'}].forEach(function(x){
        var ll = h('div',{style:{display:'flex',alignItems:'center',gap:'4px',fontSize:'10px',color:'#64748b'}});
        ll.appendChild(h('span',{style:{width:'8px',height:'8px',borderRadius:'2px',background:x.c,flexShrink:'0'}}));
        ll.appendChild(document.createTextNode(x.l));
        blgd.appendChild(ll);
      });
      barCard.appendChild(blgd);
    }
    vizRow.appendChild(barCard);
    wrap.appendChild(vizRow);

    // Scheme breakdown row
    var ausN = myAtts.filter(function(a){return a.scheme==='AusPayNet';}).length;
    var apN = myAtts.filter(function(a){return a.scheme==='AP+';}).length;
    var schemeRow = h('div',{style:{display:'flex',gap:'8px',marginBottom:'20px'}});
    [{l:'AusPayNet',v:ausN,bg:'#eff6ff',c:'#2563eb',b:'#bfdbfe'},{l:'AP+',v:apN,bg:'#faf5ff',c:'#7c3aed',b:'#ddd6fe'}].forEach(function(x){
      schemeRow.appendChild(h('span',{style:{fontSize:'12px',padding:'4px 12px',borderRadius:'20px',background:x.bg,color:x.c,border:'1px solid '+x.b,fontWeight:'500'}},x.v+' '+x.l));
    });
    wrap.appendChild(schemeRow);
  }

  // Attestation cards
  myAtts.forEach(function(att) {
    var st = getAttStatus(att);
    var card = h('div',{style:{background:'#fff',borderRadius:'12px',border:st.color==='#dc2626'?'1px solid #fecaca':'1px solid #f1f5f9',boxShadow:'0 1px 3px rgba(0,0,0,.04)',marginBottom:'16px',overflow:'hidden'}});

    var header = h('div',{style:{padding:'20px'}});
    var topRow = h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'16px'}});

    var left = h('div',{style:{flex:'1',minWidth:'0'}});
    var badges = h('div',{style:{display:'flex',gap:'6px',marginBottom:'6px',flexWrap:'wrap'}});
    var schemeC = att.scheme==='AP+'?{bg:'#faf5ff',c:'#7c3aed',b:'#ddd6fe'}:{bg:'#eff6ff',c:'#2563eb',b:'#bfdbfe'};
    badges.appendChild(h('span',{style:{fontSize:'11px',padding:'2px 8px',borderRadius:'20px',background:schemeC.bg,color:schemeC.c,border:'1px solid '+schemeC.b}},att.scheme));
    badges.appendChild(h('span',{style:{fontSize:'11px',padding:'2px 8px',borderRadius:'20px',background:st.bg,color:st.color,fontWeight:'600'}},st.badge));
    left.appendChild(badges);
    left.appendChild(h('h3',{style:{fontWeight:'600',fontSize:'14px',color:'#1e293b',marginBottom:'4px'}},att.name));
    var dueInfo = '📅 Due '+fmtDate(att.due);
    if (st.days>=0) dueInfo += ' · '+st.days+'d left'; else dueInfo += ' · Overdue';
    if (!isCrew) dueInfo += ' · '+att.teams.length+' team'+(att.teams.length!==1?'s':'');
    left.appendChild(h('p',{style:{fontSize:'11px',color:st.days<=14&&st.days>=0?'#dc2626':'#94a3b8'}},dueInfo));
    topRow.appendChild(left);

    // Crew: submit button
    if (isCrew && att.teams.indexOf(u.id)>=0) {
      var mySub = getTeamSub(att.id, u.id);
      var myStatus = mySub && mySub.status!=='draft' ? mySub.status : 'not-submitted';
      var right = h('div',{style:{display:'flex',alignItems:'center',gap:'8px',flexShrink:'0'}});
      var stColors = {'not-submitted':{bg:'#f3f4f6',c:'#6b7280'},submitted:{bg:'#FFF9C4',c:'#7A5F00'},approved:{bg:'#dcfce7',c:'#16a34a'},rejected:{bg:'#fee2e2',c:'#dc2626'},partial:{bg:'#fef9c3',c:'#a16207'}};
      var sc = stColors[myStatus]||stColors['not-submitted'];
      right.appendChild(h('span',{style:{fontSize:'11px',padding:'3px 10px',borderRadius:'20px',background:sc.bg,color:sc.c,fontWeight:'600'}},myStatus==='not-submitted'?'Not Submitted':myStatus.charAt(0).toUpperCase()+myStatus.slice(1)));
      var btnLabel = myStatus==='not-submitted'?'Submit':myStatus==='rejected'?'Resubmit':'View / Edit';
      var isPrimary = myStatus==='not-submitted'||myStatus==='rejected';
      right.appendChild(h('button',{style:{
        padding:'6px 14px',borderRadius:'8px',border:'none',fontSize:'13px',fontWeight:'600',cursor:'pointer',
        background:isPrimary?'#FFD000':'#f1f5f9',color:isPrimary?'#1A1A1A':'#475569'
      },onClick:function(){state.selectedAtt=att;state.view='submit';render();}},btnLabel));
      topRow.appendChild(right);
    }
    header.appendChild(topRow);

    // Admin: team chips
    if (!isCrew) {
      var chips = h('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap',marginTop:'12px'}});
      att.teams.forEach(function(tid) {
        var team = state.users.find(function(u){return u.id===tid});
        var sub = getTeamSub(att.id, tid);
        var ts = sub && sub.status!=='draft' ? sub.status : 'not-submitted';
        var icon = {approved:'✓',rejected:'✗',partial:'◑',submitted:'⏳','not-submitted':'–'}[ts]||'–';
        var cbg = ts==='approved'?'#f0fdf4':ts==='rejected'?'#fef2f2':(ts==='submitted'||ts==='partial')?'#FFF9C4':'#f8fafc';
        var cbr = ts==='approved'?'#bbf7d0':ts==='rejected'?'#fecaca':(ts==='submitted'||ts==='partial')?'#FFD000':'#e2e8f0';
        var chip = h('div',{style:{display:'flex',alignItems:'center',gap:'6px',fontSize:'11px',padding:'4px 10px',borderRadius:'8px',background:cbg,border:'1px solid '+cbr}},[
          h('span',{style:{fontWeight:'600',color:'#334155'}},team?team.name:tid),
          h('span',{style:{color:ts==='approved'?'#16a34a':ts==='rejected'?'#dc2626':ts==='submitted'?'#7A5F00':'#94a3b8'}},icon)
        ]);
        if (ts==='submitted') {
          chip.appendChild(h('button',{style:{fontSize:'11px',color:'#7A5F00',border:'none',background:'none',cursor:'pointer',textDecoration:'underline',marginLeft:'2px'},
            onClick:function(){state.reviewSource='dashboard';state.selectedAtt=att;state.selectedTeam=tid;state.view='review';render();}
          },'Review'));
        }
        if (ts==='approved'||ts==='rejected'||ts==='partial') {
          chip.appendChild(h('button',{style:{fontSize:'11px',color:'#64748b',border:'none',background:'none',cursor:'pointer',textDecoration:'underline',marginLeft:'2px'},
            onClick:function(){state.reviewSource='dashboard';state.selectedAtt=att;state.selectedTeam=tid;state.view='review';render();}
          },'View'));
        }
        chips.appendChild(chip);
      });
      header.appendChild(chips);
    }

    card.appendChild(header);
    wrap.appendChild(card);
  });
  return wrap;
}

// ═══════════ HISTORY VIEW ═══════════
function renderHistory() {
  var u = state.currentUser;
  var isCrew = u.role === 'crew';
  var wrap = h('div',{style:{padding:'28px',maxWidth:'900px'}});

  wrap.appendChild(h('h1',{style:{fontSize:'20px',fontWeight:'700',marginBottom:'4px'}},'Attestation History'));
  wrap.appendChild(h('p',{style:{fontSize:'13px',color:'#64748b',marginBottom:'6px'}},isCrew?'Your past submissions.':'All submissions across teams.'));
  wrap.appendChild(h('p',{style:{fontSize:'11px',color:'#94a3b8',marginBottom:'20px'}},'ℹ Uploaded screenshots are not persisted across sessions.'));

  var stColors = {submitted:{bg:'#FFF9C4',c:'#7A5F00'},approved:{bg:'#dcfce7',c:'#16a34a'},rejected:{bg:'#fee2e2',c:'#dc2626'},partial:{bg:'#fef9c3',c:'#a16207'},'not-submitted':{bg:'#f3f4f6',c:'#6b7280'}};

  if (!isCrew) {
    var filters = [{v:'all',l:'All'},{v:'submitted',l:'Submitted'},{v:'approved',l:'Approved'},{v:'partial',l:'Partial'},{v:'rejected',l:'Rejected'}];
    var bar = h('div',{style:{display:'flex',gap:'4px',background:'#f1f5f9',borderRadius:'8px',padding:'4px',width:'fit-content',marginBottom:'20px'}});
    filters.forEach(function(f) {
      var active = state.historyFilter === f.v;
      bar.appendChild(h('button',{style:{
        padding:'5px 12px',fontSize:'12px',fontWeight:'500',borderRadius:'6px',border:'none',cursor:'pointer',
        background:active?'#fff':'transparent',color:active?'#1e293b':'#64748b',
        boxShadow:active?'0 1px 2px rgba(0,0,0,.05)':'none'
      },onClick:function(){state.historyFilter=f.v;render();}},f.l));
    });
    wrap.appendChild(bar);
  }

  var subs = state.submissions.filter(function(s) {
    if (isCrew) return s.teamId === u.id;
    return true;
  });
  if (!isCrew && state.historyFilter !== 'all') {
    subs = subs.filter(function(s){ return s.status === state.historyFilter; });
  }
  subs = subs.slice().sort(function(a,b){ return b.at.localeCompare(a.at); });

  if (!subs.length) {
    wrap.appendChild(h('div',{style:{background:'#fff',borderRadius:'12px',border:'1px solid #f1f5f9',padding:'48px',textAlign:'center',color:'#94a3b8'}},'No attestation history yet.'));
    return wrap;
  }

  subs.forEach(function(sub) {
    var att = state.attestations.find(function(a){ return a.id === sub.attId; });
    if (!att) return;
    var team = state.users.find(function(tu){ return tu.id === sub.teamId; });
    var ai = sub.aiReview;
    var sc = stColors[sub.status] || stColors['not-submitted'];
    var schemeC = att.scheme==='AP+'?{bg:'#faf5ff',c:'#7c3aed',b:'#ddd6fe'}:{bg:'#eff6ff',c:'#2563eb',b:'#bfdbfe'};

    var card = h('div',{style:{
      background:'#fff',borderRadius:'12px',border:'1px solid #f1f5f9',
      boxShadow:'0 1px 3px rgba(0,0,0,.04)',marginBottom:'12px',padding:'16px 20px',
      display:'flex',alignItems:'center',gap:'16px',cursor:'pointer'
    },onClick:function(){
      state.reviewSource='history';
      state.selectedAtt=att;
      state.selectedTeam=sub.teamId;
      state.view='review';
      render();
    }});

    var left = h('div',{style:{flex:'1',minWidth:'0'}});
    left.appendChild(h('span',{style:{fontSize:'10px',padding:'2px 7px',borderRadius:'20px',background:schemeC.bg,color:schemeC.c,border:'1px solid '+schemeC.b}},att.scheme));
    left.appendChild(h('div',{style:{fontWeight:'600',fontSize:'14px',color:'#1e293b',marginTop:'4px',marginBottom:'2px'}},att.name));
    left.appendChild(h('div',{style:{fontSize:'11px',color:'#94a3b8'}},(team?team.name:sub.teamId)+' · '+fmtDate(sub.at)));

    var mid = h('div',{style:{textAlign:'center',flexShrink:'0',minWidth:'70px'}});
    if (ai) {
      mid.appendChild(h('div',{style:{fontSize:'20px',fontWeight:'800',color:ai.color}},ai.overall+'%'));
      mid.appendChild(h('div',{style:{fontSize:'10px',color:ai.color,fontWeight:'600'}},ai.label));
    }

    var right = h('div',{style:{display:'flex',alignItems:'center',gap:'10px',flexShrink:'0'}});
    right.appendChild(h('span',{style:{fontSize:'11px',padding:'3px 10px',borderRadius:'20px',background:sc.bg,color:sc.c,fontWeight:'600'}},sub.status.charAt(0).toUpperCase()+sub.status.slice(1)));
    right.appendChild(h('button',{style:{
      padding:'6px 12px',fontSize:'12px',fontWeight:'600',borderRadius:'8px',border:'none',
      background:'#f1f5f9',color:'#475569',cursor:'pointer',flexShrink:'0'
    },onClick:function(e){
      e.stopPropagation();
      state.reviewSource='history';
      state.selectedAtt=att;
      state.selectedTeam=sub.teamId;
      state.view='review';
      render();
    }},'View Details'));

    card.appendChild(left);
    card.appendChild(mid);
    card.appendChild(right);
    wrap.appendChild(card);
  });

  return wrap;
}

// ═══════════ SUBMIT VIEW ═══════════
function renderSubmit() {
  var att = state.selectedAtt;
  var u = state.currentUser;
  var existingSub = getTeamSub(att.id, u.id);
  // Only show questions assigned to this team (empty teams = all teams)
  var myChecklist = teamChecklist(att, u.id);
  var responses = {};
  myChecklist.forEach(function(ci) {
    if (existingSub && existingSub.responses && existingSub.responses[ci.id]) {
      responses[ci.id] = {text: existingSub.responses[ci.id].text, files: existingSub.responses[ci.id].files.slice(), subChecks: existingSub.responses[ci.id].subChecks||{}};
    } else {
      responses[ci.id] = {text:'', files:[], subChecks:{}};
    }
  });
  var activeIdx = 0;

  function buildView() {
    var wrap = h('div',{style:{padding:'28px',maxWidth:'900px'}});
    wrap.appendChild(h('button',{style:{fontSize:'13px',color:'#64748b',border:'none',background:'none',cursor:'pointer',marginBottom:'16px',padding:'0'},
      onClick:function(){state.view='dashboard';render();}
    },'← Back to dashboard'));

    var schemeC = att.scheme==='AP+'?{bg:'#faf5ff',c:'#7c3aed',b:'#ddd6fe'}:{bg:'#eff6ff',c:'#2563eb',b:'#bfdbfe'};
    wrap.appendChild(h('span',{style:{fontSize:'11px',padding:'2px 8px',borderRadius:'20px',background:schemeC.bg,color:schemeC.c,border:'1px solid '+schemeC.b}},att.scheme));
    wrap.appendChild(h('h2',{style:{fontSize:'18px',fontWeight:'700',marginTop:'8px',marginBottom:'4px'}},att.name));

    var answered = myChecklist.filter(function(ci){var r=responses[ci.id]; return (r.text&&r.text.trim())||r.files.length;}).length;
    wrap.appendChild(h('p',{style:{fontSize:'13px',color:'#64748b',marginBottom:'20px'}},'Due '+fmtDate(att.due)+' · '+answered+'/'+myChecklist.length+' answered'+(myChecklist.length<att.checklist.length?' ('+myChecklist.length+' of '+att.checklist.length+' questions assigned to you)':'')));

    var body = h('div',{style:{display:'flex',gap:'16px'}});

    // Nav
    var nav = h('div',{style:{width:'180px',flexShrink:'0'}});
    var navCard = h('div',{style:{background:'#fff',borderRadius:'12px',border:'1px solid #f1f5f9',padding:'12px'}});
    navCard.appendChild(h('p',{style:{fontSize:'10px',fontWeight:'700',color:'#94a3b8',letterSpacing:'0.5px',marginBottom:'8px',padding:'0 8px'}},'MY QUESTIONS'));

    myChecklist.forEach(function(ci, i) {
      var r = responses[ci.id];
      var isDone = (r.text&&r.text.trim())||r.files.length;
      var isActive = i===activeIdx;
      navCard.appendChild(h('button',{style:{
        width:'100%',textAlign:'left',padding:'7px 8px',borderRadius:'6px',border:'none',
        background:isActive?'#FFFDE7':'transparent',color:isActive?'#7A5F00':'#475569',
        fontWeight:isActive?'600':'400',fontSize:'11px',cursor:'pointer',marginBottom:'2px',
        display:'flex',alignItems:'center',gap:'6px'
      },onClick:function(){activeIdx=i;wrap.parentNode.replaceChild(buildView(),wrap);}
      },[
        h('span',{style:{width:'16px',height:'16px',borderRadius:'50%',background:isDone?'#16a34a':isActive?'#FFD000':'#e2e8f0',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'9px',fontWeight:'700',flexShrink:'0'}},isDone?'✓':String(i+1)),
        h('span',{style:{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:'1'}},ci.title),
        ci.req ? h('span',{style:{color:'#f87171',flexShrink:'0'}},'*') : null
      ]));
    });
    nav.appendChild(navCard);
    body.appendChild(nav);

    // Form
    var ci = myChecklist[activeIdx];
    var r = responses[ci.id];
    var form = h('div',{style:{flex:'1',background:'#fff',borderRadius:'12px',border:'1px solid #f1f5f9',padding:'24px'}});

    var titleRow = h('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'4px',flexWrap:'wrap'}});
    titleRow.appendChild(h('h3',{style:{fontWeight:'600',fontSize:'15px',color:'#1e293b'}},ci.title));
    if (ci.req) titleRow.appendChild(h('span',{style:{fontSize:'10px',background:'#fef2f2',color:'#dc2626',padding:'2px 6px',borderRadius:'4px'}},'Required'));
    form.appendChild(titleRow);
    form.appendChild(h('p',{style:{fontSize:'13px',color:'#64748b',marginBottom:'12px'}},ci.desc));

    var evidLabels = [];
    if (ci.type==='text'||ci.type==='both') evidLabels.push('📝 Text response');
    if (ci.type==='screenshot'||ci.type==='both') evidLabels.push('📎 Screenshot evidence');
    form.appendChild(h('p',{style:{fontSize:'11px',color:'#94a3b8',marginBottom:'16px'}},evidLabels.join('  ·  ')));

    // Sub-checklist
    if ((ci.subItems||[]).length>0) {
      var subBox = h('div',{style:{background:'#FFFDE7',border:'1px solid #FFD000',borderRadius:'8px',padding:'12px',marginBottom:'16px'}});
      subBox.appendChild(h('p',{style:{fontSize:'10px',fontWeight:'700',color:'#7A5F00',letterSpacing:'0.5px',marginBottom:'8px'}},'COMPLIANCE CHECKLIST'));
      ci.subItems.forEach(function(si){
        var siRow = h('label',{style:{display:'flex',alignItems:'center',gap:'8px',fontSize:'12px',color:'#334155',cursor:'pointer',marginBottom:'6px'}});
        var cb = h('input',{type:'checkbox'});
        cb.checked = !!r.subChecks[si.id];
        cb.addEventListener('change',function(){r.subChecks[si.id]=this.checked;});
        siRow.appendChild(cb);
        siRow.appendChild(document.createTextNode(si.text||'(untitled sub-item)'));
        subBox.appendChild(siRow);
      });
      form.appendChild(subBox);
    }

    if (ci.type==='text'||ci.type==='both') {
      form.appendChild(h('label',{style:{fontSize:'11px',fontWeight:'600',color:'#64748b',display:'block',marginBottom:'4px'}},'Text Response'));
      var ta = h('textarea',{style:{
        width:'100%',height:'140px',border:'1px solid #e2e8f0',borderRadius:'8px',padding:'12px',fontSize:'13px',
        resize:'none',fontFamily:'inherit',outline:'none'
      },placeholder:'Be specific — include dates, tool names, metrics, and outcomes. Responses under 40 words will be flagged.'});
      ta.value = r.text;
      ta.addEventListener('input',function(){r.text=this.value; var wc=r.text.trim()?r.text.trim().split(/\s+/).length:0; wcEl.textContent=wc+' words';});
      form.appendChild(ta);
      var wc = r.text.trim() ? r.text.trim().split(/\s+/).length : 0;
      var wcEl = h('p',{style:{fontSize:'11px',color:'#94a3b8',marginTop:'4px',marginBottom:'16px'}},wc+' words');
      form.appendChild(wcEl);
    }

    if (ci.type==='screenshot'||ci.type==='both') {
      form.appendChild(h('label',{style:{fontSize:'11px',fontWeight:'600',color:'#64748b',display:'block',marginBottom:'4px'}},'Screenshots / Evidence'));
      var fileInput = h('input',{type:'file',accept:'image/*',multiple:true,style:{display:'none'}});
      fileInput.addEventListener('change',function(){
        Array.from(this.files).forEach(function(f){
          var reader = new FileReader();
          reader.onload = function(e){ r.files.push({name:f.name,data:e.target.result}); wrap.parentNode.replaceChild(buildView(),wrap); };
          reader.readAsDataURL(f);
        });
      });
      var dropZone = h('label',{style:{
        display:'flex',alignItems:'center',justifyContent:'center',gap:'8px',
        border:'2px dashed #e2e8f0',borderRadius:'8px',padding:'16px',cursor:'pointer',
        fontSize:'13px',color:'#94a3b8',transition:'all .15s'
      },onMouseenter:function(){this.style.borderColor='#FFD000';this.style.background='#FFFDE7'},
        onMouseleave:function(){this.style.borderColor='#e2e8f0';this.style.background='transparent'},onMouseenter:function(){this.style.borderColor='#FFD000';this.style.background='#FFFDE7'}},[
        h('span',{},'📁 Click to upload images'),
        fileInput
      ]);
      form.appendChild(dropZone);

      if (r.files.length) {
        var grid = h('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px',marginTop:'8px'}});
        r.files.forEach(function(f,fi){
          var thumb = h('div',{style:{borderRadius:'8px',overflow:'hidden',border:'1px solid #e2e8f0',position:'relative'}},[
            h('img',{src:f.data,style:{width:'100%',height:'60px',objectFit:'cover'}}),
            h('button',{style:{position:'absolute',top:'4px',right:'4px',width:'18px',height:'18px',borderRadius:'50%',background:'#ef4444',color:'#fff',border:'none',cursor:'pointer',fontSize:'11px',display:'flex',alignItems:'center',justifyContent:'center'},
              onClick:function(){r.files.splice(fi,1);wrap.parentNode.replaceChild(buildView(),wrap);}
            },'×'),
            h('p',{style:{fontSize:'9px',color:'#94a3b8',padding:'2px 4px',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},f.name)
          ]);
          grid.appendChild(thumb);
        });
        form.appendChild(grid);
      }
    }

    // Change history for this question
    var qHistory = [];
    if (existingSub && existingSub.versions) {
      existingSub.versions.slice().reverse().forEach(function(v) {
        (v.changes||[]).forEach(function(ch) {
          if (ch.ciId === ci.id) qHistory.push({by:v.savedBy, at:v.savedAt, field:ch.field, from:ch.from, to:ch.to});
        });
      });
    }
    if (qHistory.length > 0) {
      var histBox = h('div',{style:{marginTop:'16px',borderTop:'1px solid #f1f5f9',paddingTop:'12px'}});
      var histHdr = h('div',{style:{display:'flex',alignItems:'center',gap:'6px',marginBottom:'8px'}});
      histHdr.appendChild(h('span',{style:{fontSize:'10px',fontWeight:'700',color:'#94a3b8',letterSpacing:'0.5px'}},'CHANGE HISTORY'));
      histHdr.appendChild(h('span',{style:{fontSize:'10px',padding:'1px 6px',borderRadius:'10px',background:'#f1f5f9',color:'#64748b'}},qHistory.length+' change'+(qHistory.length!==1?'s':'')));
      histBox.appendChild(histHdr);
      qHistory.slice(0,3).forEach(function(ch) {
        var row = h('div',{style:{display:'flex',alignItems:'flex-start',gap:'8px',fontSize:'11px',color:'#64748b',marginBottom:'6px',padding:'6px 8px',background:'#f8fafc',borderRadius:'6px'}});
        row.appendChild(h('span',{style:{fontSize:'13px',flexShrink:'0'}},'✏️'));
        var info = h('div',{style:{flex:'1',minWidth:'0'}});
        info.appendChild(h('div',{style:{fontWeight:'600',color:'#475569'}},ch.by+' · '+fmtDateTime(ch.at)));
        info.appendChild(h('div',{style:{color:'#94a3b8',marginTop:'1px'}},ch.field));
        row.appendChild(info);
        histBox.appendChild(row);
      });
      if (qHistory.length > 3) histBox.appendChild(h('div',{style:{fontSize:'10px',color:'#94a3b8',padding:'0 8px'}},'+' +(qHistory.length-3)+' earlier change'+(qHistory.length-3!==1?'s':'')));
      histBox.appendChild(h('div',{style:{marginTop:'6px'}}));
      form.appendChild(histBox);
    }

    // Nav buttons + submit
    var btns = h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'20px',paddingTop:'16px',borderTop:'1px solid #f1f5f9'}});
    var navBtns = h('div',{style:{display:'flex',gap:'8px'}});
    if (activeIdx>0) navBtns.appendChild(h('button',{style:{padding:'6px 12px',fontSize:'13px',border:'1px solid #e2e8f0',borderRadius:'8px',background:'#fff',cursor:'pointer',color:'#475569'},
      onClick:function(){activeIdx--;wrap.parentNode.replaceChild(buildView(),wrap);}
    },'← Prev'));
    if (activeIdx<myChecklist.length-1) navBtns.appendChild(h('button',{style:{padding:'6px 12px',fontSize:'13px',border:'1px solid #e2e8f0',borderRadius:'8px',background:'#fff',cursor:'pointer',color:'#475569'},
      onClick:function(){activeIdx++;wrap.parentNode.replaceChild(buildView(),wrap);}
    },'Next →'));
    btns.appendChild(navBtns);
    btns.appendChild(h('button',{style:{padding:'8px 20px',fontSize:'13px',fontWeight:'600',border:'none',borderRadius:'8px',background:'#FFD000',color:'#1A1A1A',cursor:'pointer'},
      onClick:function(){
        var existing = getTeamSub(att.id, u.id);
        var versionEntry = createVersionEntry(existing, responses, att, u);
        var newSub = {
          id: existing ? existing.id : 'sub-'+Date.now(),
          attId: att.id, teamId: u.id,
          at: new Date().toISOString().slice(0,10),
          status: 'submitted',
          responses: responses,
          aiReview: null,
          manualReview: existing ? existing.manualReview : null,
          versions: (existing ? (existing.versions||[]) : []).concat([versionEntry])
        };
        newSub.aiReview = runAI(newSub, att, u.id);
        if (existing) {
          var idx = state.submissions.indexOf(existing);
          state.submissions[idx] = newSub;
        } else {
          state.submissions.push(newSub);
        }
        saveSubmissions();
        state.view='dashboard'; render();
      }
    },'Submit for Review'));
    form.appendChild(btns);
    body.appendChild(form);
    wrap.appendChild(body);
    return wrap;
  }

  return buildView();
}

// ═══════════ REVIEW VIEW ═══════════
function renderReview() {
  var att = state.selectedAtt;
  var tid = state.selectedTeam;
  var team = state.users.find(function(u){return u.id===tid});
  var sub = getTeamSub(att.id, tid);
  var wrap = h('div',{style:{padding:'28px',maxWidth:'850px'}});

  wrap.appendChild(h('button',{style:{fontSize:'13px',color:'#64748b',border:'none',background:'none',cursor:'pointer',marginBottom:'16px',padding:'0'},
    onClick:function(){state.view=state.reviewSource||'dashboard';render();}
  },'← Back to '+(state.reviewSource==='history'?'history':'dashboard')));

  if (!sub) {
    wrap.appendChild(h('div',{style:{background:'#fff',borderRadius:'12px',border:'1px solid #f1f5f9',padding:'48px',textAlign:'center',color:'#94a3b8'}},'No submission found from '+(team?team.name:tid)+'.'));
    return wrap;
  }

  var ai = sub.aiReview;
  // Questions assigned to this team
  var reviewChecklist = teamChecklist(att, tid);

  // Per-question review state — lives in renderReview closure so it survives tab switches
  var itemReviews = {};
  reviewChecklist.forEach(function(ci) {
    var ex = sub.manualReview && sub.manualReview.items && sub.manualReview.items[ci.id];
    itemReviews[ci.id] = {status: ex ? ex.status : 'pending', comments: ex ? (ex.comments||'') : ''};
  });

  // Header
  var hdr = h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'20px',gap:'16px'}});
  var hdrL = h('div',{});
  var schemeC = att.scheme==='AP+'?{bg:'#faf5ff',c:'#7c3aed',b:'#ddd6fe'}:{bg:'#eff6ff',c:'#2563eb',b:'#bfdbfe'};
  hdrL.appendChild(h('span',{style:{fontSize:'11px',padding:'2px 8px',borderRadius:'20px',background:schemeC.bg,color:schemeC.c,border:'1px solid '+schemeC.b}},att.scheme));
  hdrL.appendChild(h('h2',{style:{fontSize:'18px',fontWeight:'700',marginTop:'8px',marginBottom:'4px'}},att.name));
  hdrL.appendChild(h('p',{style:{fontSize:'13px',color:'#64748b'}},'Submitted by '+(team?team.name:tid)+' on '+fmtDate(sub.at)+' · Due '+fmtDate(att.due)));
  hdr.appendChild(hdrL);
  var hdrR = h('div',{style:{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:'8px',flexShrink:'0'}});
  if (ai) {
    hdrR.appendChild(h('div',{style:{background:ai.color+'18',border:'1px solid '+ai.color+'40',borderRadius:'12px',padding:'12px 20px',textAlign:'center'}},[
      h('div',{style:{fontSize:'24px',fontWeight:'800',color:ai.color}},ai.overall+'%'),
      h('div',{style:{fontSize:'11px',fontWeight:'600',color:ai.color}},ai.label)
    ]));
  }
  hdrR.appendChild(h('button',{style:{
    padding:'7px 14px',fontSize:'12px',fontWeight:'600',border:'1px solid #FFD000',borderRadius:'8px',
    background:'#FFFDE7',color:'#7A5F00',cursor:'pointer'
  },onClick:function(){exportFinalAttestationDoc(att);}},'📄 Full Attestation Doc'));
  if (sub.status==='approved'||sub.status==='partial') {
    hdrR.appendChild(h('button',{style:{
      padding:'7px 14px',fontSize:'12px',fontWeight:'600',border:'1px solid #d1fae5',borderRadius:'8px',
      background:'#f0fdf4',color:'#16a34a',cursor:'pointer'
    },onClick:function(){exportSubmissionReport(sub,att,team);}},'⬇ This Team\'s Report'));
  }
  hdr.appendChild(hdrR);
  wrap.appendChild(hdr);

  // Tabs
  var activeTab = 'ai';
  var tabWrap = h('div',{style:{display:'flex',gap:'4px',background:'#f1f5f9',borderRadius:'8px',padding:'4px',width:'fit-content',marginBottom:'20px'}});
  var contentArea = h('div',{});

  function renderTab(t) {
    activeTab = t;
    tabWrap.querySelectorAll('button').forEach(function(b){
      b.style.background = b.dataset.tab===t?'#fff':'transparent';
      b.style.color = b.dataset.tab===t?'#1e293b':'#64748b';
      b.style.boxShadow = b.dataset.tab===t?'0 1px 2px rgba(0,0,0,.05)':'none';
    });
    contentArea.innerHTML = '';
    if (t==='ai') contentArea.appendChild(renderAITab());
    else if (t==='manual') contentArea.appendChild(renderManualTab());
    else if (t==='evidence') contentArea.appendChild(renderEvidenceTab());
    else contentArea.appendChild(renderVersionHistoryTab());
  }

  ['ai','manual','evidence','versions'].forEach(function(t) {
    var labels = {ai:'🤖 AI Review',manual:'👤 Manual Review',evidence:'📎 Evidence',versions:'🕐 Version History'};
    tabWrap.appendChild(h('button',{style:{
      padding:'6px 12px',fontSize:'13px',fontWeight:'500',borderRadius:'6px',border:'none',cursor:'pointer',
      background:t===activeTab?'#fff':'transparent',color:t===activeTab?'#1e293b':'#64748b'
    },'data-tab':t,onClick:function(){renderTab(t);}},labels[t]));
  });
  wrap.appendChild(tabWrap);

  function renderAITab() {
    var d = h('div',{});
    if (!ai) { d.appendChild(h('p',{style:{color:'#94a3b8',padding:'32px',textAlign:'center'}},'No AI review available.')); return d; }

    // Overall
    var overall = h('div',{style:{background:ai.color+'10',border:'1px solid '+ai.color+'30',borderRadius:'12px',padding:'20px',marginBottom:'16px'}});
    overall.appendChild(h('p',{style:{fontWeight:'600',color:'#1e293b',marginBottom:'4px',fontSize:'14px'}},'AI Overall Assessment'));
    overall.appendChild(h('p',{style:{fontSize:'13px',color:'#475569',marginBottom:'16px'}},ai.comment));

    var bars = h('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'16px'}});
    [{l:'Completeness',v:ai.comp},{l:'Quality',v:ai.qual},{l:'Screenshots',v:ai.shot}].forEach(function(b){
      var col = h('div',{});
      col.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'11px',marginBottom:'4px'}},[
        h('span',{style:{color:'#475569'}},b.l),
        h('span',{style:{fontWeight:'600',color:'#1e293b'}},b.v+'%')
      ]));
      var track = h('div',{style:{height:'6px',background:'rgba(255,255,255,.6)',borderRadius:'99px',overflow:'hidden'}});
      track.appendChild(h('div',{style:{height:'100%',width:b.v+'%',background:ai.color,borderRadius:'99px'}}));
      col.appendChild(track);
      bars.appendChild(col);
    });
    overall.appendChild(bars);
    d.appendChild(overall);

    // Item comments
    var itemsCard = h('div',{style:{background:'#fff',borderRadius:'12px',border:'1px solid #f1f5f9',overflow:'hidden'}});
    itemsCard.appendChild(h('p',{style:{padding:'12px 16px',fontSize:'10px',fontWeight:'700',color:'#94a3b8',letterSpacing:'0.5px',borderBottom:'1px solid #f8fafc'}},'ITEM-LEVEL COMMENTS'));
    reviewChecklist.forEach(function(ci){
      var comments = ai.items[ci.id] || [];
      var r = sub.responses[ci.id];
      var row = h('div',{style:{padding:'12px 16px',borderBottom:'1px solid #f8fafc'}});
      var rowH = h('div',{style:{display:'flex',alignItems:'center',gap:'6px',marginBottom:'6px',flexWrap:'wrap'}});
      rowH.appendChild(h('span',{style:{fontSize:'12px',fontWeight:'600',color:'#334155'}},ci.title));
      if (ci.req) rowH.appendChild(h('span',{style:{fontSize:'10px',background:'#fef2f2',color:'#dc2626',padding:'1px 5px',borderRadius:'3px'}},'Required'));
      if (r && r.text && r.text.trim()) rowH.appendChild(h('span',{style:{fontSize:'10px',background:'#f0fdf4',color:'#16a34a',padding:'1px 5px',borderRadius:'3px',marginLeft:'auto'}},'Has response'));
      row.appendChild(rowH);
      if (comments.length) {
        comments.forEach(function(c){
          var icon = c.t==='error'?'✗':c.t==='warn'?'⚠':c.t==='ok'?'✓':'ℹ';
          var color = c.t==='error'?'#dc2626':c.t==='warn'?'#ea580c':c.t==='ok'?'#16a34a':'#64748b';
          row.appendChild(h('p',{style:{fontSize:'12px',color:color,display:'flex',gap:'6px',alignItems:'flex-start',marginTop:'3px'}},[
            h('span',{style:{flexShrink:'0'}},icon),
            h('span',{},c.m)
          ]));
        });
      } else {
        row.appendChild(h('p',{style:{fontSize:'12px',color:'#16a34a'}},'✓ No issues flagged'));
      }
      itemsCard.appendChild(row);
    });
    d.appendChild(itemsCard);
    return d;
  }

  function renderManualTab() {
    var d = h('div',{});

    // Progress banner
    var total = reviewChecklist.length;
    var reviewed = reviewChecklist.filter(function(ci){return itemReviews[ci.id].status!=='pending';}).length;
    var approved = reviewChecklist.filter(function(ci){return itemReviews[ci.id].status==='approved';}).length;
    var rejected = reviewChecklist.filter(function(ci){return itemReviews[ci.id].status==='rejected';}).length;
    var needsWork = reviewChecklist.filter(function(ci){return itemReviews[ci.id].status==='needs-work';}).length;

    var progressBar = h('div',{style:{background:'#fff',borderRadius:'12px',border:'1px solid #f1f5f9',padding:'14px 18px',marginBottom:'16px',display:'flex',alignItems:'center',gap:'16px',flexWrap:'wrap'}});
    progressBar.appendChild(h('div',{style:{flex:'1',minWidth:'180px'}},[
      h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'11px',color:'#64748b',marginBottom:'5px'}},[
        h('span',{},'Question review progress'),
        h('span',{style:{fontWeight:'600',color:'#1e293b'}},reviewed+' / '+total+' reviewed')
      ]),
      h('div',{style:{height:'6px',background:'#f1f5f9',borderRadius:'99px',overflow:'hidden'}},
        h('div',{style:{height:'100%',width:(reviewed/total*100)+'%',background:'#FFD000',borderRadius:'99px',transition:'width .3s'}}))
    ]));
    var chips = h('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap'}});
    if (approved) chips.appendChild(h('span',{style:{fontSize:'11px',padding:'2px 8px',borderRadius:'20px',background:'#dcfce7',color:'#16a34a',fontWeight:'600'}},approved+' Approved'));
    if (needsWork) chips.appendChild(h('span',{style:{fontSize:'11px',padding:'2px 8px',borderRadius:'20px',background:'#FFF9C4',color:'#7A5F00',fontWeight:'600'}},needsWork+' Needs Work'));
    if (rejected) chips.appendChild(h('span',{style:{fontSize:'11px',padding:'2px 8px',borderRadius:'20px',background:'#fee2e2',color:'#dc2626',fontWeight:'600'}},rejected+' Rejected'));
    progressBar.appendChild(chips);
    d.appendChild(progressBar);

    // Per-question cards
    reviewChecklist.forEach(function(ci, idx) {
      var r = sub.responses[ci.id] || {text:'',files:[],subChecks:{}};
      var ir = itemReviews[ci.id];
      var statusColors = {
        approved:{border:'#16a34a',bg:'#f0fdf4',badge:'#dcfce7',badgeC:'#16a34a'},
        'needs-work':{border:'#FFD000',bg:'#FFFDE7',badge:'#FFF9C4',badgeC:'#7A5F00'},
        rejected:{border:'#dc2626',bg:'#fef2f2',badge:'#fee2e2',badgeC:'#dc2626'},
        pending:{border:'#e2e8f0',bg:'#fff',badge:'#f1f5f9',badgeC:'#94a3b8'}
      };
      var sc = statusColors[ir.status]||statusColors.pending;

      var qCard = h('div',{style:{background:sc.bg,borderRadius:'12px',border:'2px solid '+sc.border,padding:'16px',marginBottom:'12px',transition:'border-color .2s'}});

      // Question header
      var qHdr = h('div',{style:{display:'flex',alignItems:'flex-start',gap:'10px',marginBottom:'10px',flexWrap:'wrap'}});
      qHdr.appendChild(h('div',{style:{width:'22px',height:'22px',borderRadius:'50%',background:'#1A1A1A',color:'#FFD000',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'10px',fontWeight:'800',flexShrink:'0',marginTop:'1px'}},String(idx+1)));
      var qTitle = h('div',{style:{flex:'1',minWidth:'0'}});
      qTitle.appendChild(h('div',{style:{fontWeight:'700',fontSize:'13px',color:'#1e293b',marginBottom:'2px'}},[
        document.createTextNode(ci.title),
        ci.req ? h('span',{style:{fontSize:'10px',background:'#fef2f2',color:'#dc2626',padding:'1px 5px',borderRadius:'3px',marginLeft:'6px'}},'Required') : null
      ]));
      qTitle.appendChild(h('div',{style:{fontSize:'11px',color:'#64748b'}},ci.desc));
      qHdr.appendChild(qTitle);
      if (ir.status!=='pending') {
        qHdr.appendChild(h('span',{style:{fontSize:'10px',padding:'2px 8px',borderRadius:'20px',background:sc.badge,color:sc.badgeC,fontWeight:'700',flexShrink:'0'}},
          ir.status==='approved'?'✓ Approved':ir.status==='needs-work'?'⚠ Needs Work':'✗ Rejected'));
      }
      qCard.appendChild(qHdr);

      // Response preview (collapsible, shown as read-only)
      if (r.text && r.text.trim()) {
        var preview = h('div',{style:{background:'rgba(255,255,255,0.7)',border:'1px solid #e2e8f0',borderRadius:'8px',padding:'10px 12px',fontSize:'12px',color:'#334155',marginBottom:'10px',maxHeight:'80px',overflow:'auto',whiteSpace:'pre-wrap'}},r.text);
        qCard.appendChild(preview);
      } else if (ci.req) {
        qCard.appendChild(h('div',{style:{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:'6px',padding:'8px 12px',fontSize:'11px',color:'#dc2626',marginBottom:'10px'}},'⚠ No response provided for this required question'));
      }

      // Decision buttons
      var decRow = h('div',{style:{display:'flex',gap:'6px',marginBottom:'10px',flexWrap:'wrap'}});
      [{v:'approved',l:'✓ Approve',bc:'#16a34a',bg:'#f0fdf4',c:'#16a34a'},
       {v:'needs-work',l:'⚠ Needs Work',bc:'#FFD000',bg:'#FFFDE7',c:'#7A5F00'},
       {v:'rejected',l:'✗ Reject',bc:'#dc2626',bg:'#fef2f2',c:'#dc2626'}].forEach(function(o){
        var isSelected = ir.status===o.v;
        var btn = h('button',{style:{
          padding:'6px 12px',fontSize:'12px',fontWeight:'600',borderRadius:'6px',cursor:'pointer',
          border:'2px solid '+(isSelected?o.bc:'#e2e8f0'),
          background:isSelected?o.bg:'#fff',color:isSelected?o.c:'#94a3b8',
          transition:'all .15s'
        }},o.l);
        btn.addEventListener('click',function(){
          itemReviews[ci.id].status = o.v;
          // Re-render just this card's decision row and status
          var newTab = renderManualTab();
          d.parentNode.replaceChild(newTab, d);
        });
        decRow.appendChild(btn);
      });
      qCard.appendChild(decRow);

      // Comment field
      var commentLabel = h('label',{style:{fontSize:'11px',fontWeight:'600',color:'#64748b',display:'block',marginBottom:'4px'}},'Reviewer comment (optional)');
      var ta = h('textarea',{style:{
        width:'100%',height:'64px',border:'1px solid #e2e8f0',borderRadius:'6px',padding:'8px 10px',
        fontSize:'12px',resize:'none',fontFamily:'inherit',outline:'none',background:'rgba(255,255,255,0.8)'
      },placeholder:'Note what needs to change, or confirm why this is approved…'});
      ta.value = ir.comments;
      ta.addEventListener('input',function(){itemReviews[ci.id].comments=this.value;});

                      statuses.some(function(s){return s==='rejected';}) ? 'rejected' : 'partial';

        sub.manualReview = {
          items: JSON.parse(JSON.stringify(itemReviews)),

        };

  function renderEvidenceTab() {

        tb.appendChild(h('p',{style:{fontSize:'13px',color:'#334155',whiteSpace:'pre-wrap'}},r.text));
        card.appendChild(tb);

      if (hasFiles) {

  function renderVersionHistoryTab() {
    var d = h('div',{});

    if (!versions.length) {
      d.appendChild(h('div',{style:{background:'#fff',borderRadius:'12px',border:'1px solid #f1f5f9',padding:'40px',textAlign:'center',color:'#94a3b8'}},'No version history recorded yet.'));

    }

    // Audit summary banner

      var vHdr = h('div',{style:{
        padding:'12px 16px',background:isLatest?'#FFFDE7':'#f8fafc',

      }});

      ]));
      vInfo.appendChild(h('div',{style:{fontSize:'11px',color:'#94a3b8'}},

      vHdr.appendChild(vInfo);
      var statusBadge = {submitted:{bg:'#FFF9C4',c:'#7A5F00'},approved:{bg:'#dcfce7',c:'#16a34a'},rejected:{bg:'#fee2e2',c:'#dc2626'},partial:{bg:'#fef9c3',c:'#a16207'}};
      var sb2 = statusBadge[v.status]||statusBadge.submitted;

      // Changes
      if (!v.changes || v.changes.length === 0) {
        card.appendChild(h('div',{style:{padding:'12px 16px',fontSize:'12px',color:'#94a3b8'}},'No field changes detected in this version.'));
      } else {
        var changesList = h('div',{style:{padding:'8px 0'}});
        v.changes.forEach(function(ch) {
          var chRow = h('div',{style:{padding:'10px 16px',borderBottom:'1px solid #f8fafc'}});
          chRow.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:'6px',marginBottom:'4px',flexWrap:'wrap'}},[

            h('span',{style:{fontSize:'10px',color:'#94a3b8',marginLeft:'auto'}},fmtDateTime(ch.at)+' · '+ch.by)
          ]));
          var diffRow = h('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap',marginTop:'4px'}});
          // FROM
          var fromBox = h('div',{style:{flex:'1',minWidth:'200px',background:'#fef2f2',border:'1px solid #fecaca',borderRadius:'6px',padding:'8px 10px'}});
          fromBox.appendChild(h('div',{style:{fontSize:'9px',fontWeight:'700',color:'#dc2626',marginBottom:'3px'}},'BEFORE'));
          fromBox.appendChild(h('div',{style:{fontSize:'12px',color:'#334155',whiteSpace:'pre-wrap',wordBreak:'break-word',maxHeight:'80px',overflow:'auto'}},ch.from));
          diffRow.appendChild(fromBox);
          // TO
          var toBox = h('div',{style:{flex:'1',minWidth:'200px',background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:'6px',padding:'8px 10px'}});
          toBox.appendChild(h('div',{style:{fontSize:'9px',fontWeight:'700',color:'#16a34a',marginBottom:'3px'}},'AFTER'));
          toBox.appendChild(h('div',{style:{fontSize:'12px',color:'#334155',whiteSpace:'pre-wrap',wordBreak:'break-word',maxHeight:'80px',overflow:'auto'}},ch.to));
          diffRow.appendChild(toBox);
          chRow.appendChild(diffRow);
          changesList.appendChild(chRow);
        });
        card.appendChild(changesList);
      }

      // Manual review decision if recorded on this version boundary
      if (sub.manualReview && isLatest) {
        var mrRow = h('div',{style:{padding:'10px 16px',background:'#f8fafc',borderTop:'1px solid #f1f5f9',display:'flex',alignItems:'center',gap:'8px'}});

        mrRow.appendChild(h('span',{style:{fontSize:'11px',color:'#94a3b8'}},'by '+sub.manualReview.by+' on '+fmtDate(sub.manualReview.at)));
        card.appendChild(mrRow);
      }

      d.appendChild(card);
    });
    return d;
  }

  renderTab('ai');
  wrap.appendChild(contentArea);
  return wrap;
}

function escHtml(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function downloadHtml(filename, html) {
  var blob = new Blob([html],{type:'text/html'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href=url; a.download=filename; a.click();
  setTimeout(function(){URL.revokeObjectURL(url);},5000);
}

function exportDashboardReport() {
  var today = new Date().toISOString().slice(0,10);
  var myAtts = state.attestations;
  var total=myAtts.length, atRisk=0, inProg=0, done=0;
  myAtts.forEach(function(a){var s=getAttStatus(a); if(s.badge==='At Risk'||s.badge==='Overdue')atRisk++; else if(s.badge==='In Progress'||s.badge==='Under Review')inProg++; else if(s.badge==='Complete')done++;});
  var ausN = myAtts.filter(function(a){return a.scheme==='AusPayNet';}).length;
  var apN = myAtts.filter(function(a){return a.scheme==='AP+';}).length;
  var attRows = '';
  myAtts.forEach(function(att){
    var st = getAttStatus(att);
    var teamNames = att.teams.map(function(tid){var u=state.users.find(function(u){return u.id===tid;}); return u?u.name:tid;}).join(', ');
    var subCount = state.submissions.filter(function(s){return s.attId===att.id;}).length;
    attRows += '<tr style="border-bottom:1px solid #f1f5f9"><td style="padding:10px 12px;font-size:13px;font-weight:600;color:#1e293b">'+escHtml(att.name)+'</td><td style="padding:10px 12px;font-size:12px;color:#64748b">'+escHtml(att.scheme)+'</td><td style="padding:10px 12px;font-size:12px;color:#64748b">'+fmtDate(att.due)+'</td><td style="padding:10px 12px"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;background:'+st.bg+';color:'+st.color+'">'+st.badge+'</span></td><td style="padding:10px 12px;font-size:12px;color:#64748b">'+escHtml(teamNames||'None')+'</td><td style="padding:10px 12px;font-size:12px;color:#64748b">'+subCount+'</td></tr>';
    att.teams.forEach(function(tid){
      var sub2 = getTeamSub(att.id,tid);
      var team2 = state.users.find(function(u){return u.id===tid;});
      var ts = sub2&&sub2.status!=='draft'?sub2.status:'not-submitted';
      var aiScore = sub2&&sub2.aiReview?sub2.aiReview.overall+'%':'—';
      attRows += '<tr style="background:#fafafa;border-bottom:1px solid #f8fafc"><td style="padding:6px 12px 6px 28px;font-size:11px;color:#64748b" colspan="2">↳ '+(team2?escHtml(team2.name):tid)+'</td><td></td><td style="padding:6px 12px"><span style="font-size:10px;font-weight:600;color:#475569">'+ts+'</span></td><td style="padding:6px 12px;font-size:11px;color:#64748b">AI: '+aiScore+'</td><td></td></tr>';
    });
  });
  var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>AttestHub Dashboard Report</title></head><body style="font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;background:#f5f7fa;color:#1e293b;padding:32px"><div style="max-width:940px;margin:0 auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid #e2e8f0"><h1 style="font-size:22px;font-weight:800;color:#1e293b">AttestHub — Dashboard Report</h1><span style="font-size:11px;color:#94a3b8">Generated '+today+'</span></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">'+[{l:'Total',v:total,c:'#334155'},{l:'At Risk',v:atRisk,c:'#dc2626'},{l:'In Progress',v:inProg,c:'#2563eb'},{l:'Complete',v:done,c:'#16a34a'}].map(function(s){return '<div style="background:#fff;border-radius:8px;padding:14px;border:1px solid #f1f5f9"><div style="font-size:26px;font-weight:700;color:'+s.c+'">'+s.v+'</div><div style="font-size:12px;color:#64748b">'+s.l+'</div></div>';}).join('')+'</div><div style="margin-bottom:20px"><span style="font-size:12px;padding:4px 12px;border-radius:20px;background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe;margin-right:8px">'+ausN+' AusPayNet</span><span style="font-size:12px;padding:4px 12px;border-radius:20px;background:#faf5ff;color:#7c3aed;border:1px solid #ddd6fe">'+apN+' AP+</span></div><table style="width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;border:1px solid #f1f5f9"><thead><tr style="background:#f8fafc;border-bottom:1px solid #e2e8f0"><th style="padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:#94a3b8">ATTESTATION</th><th style="padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:#94a3b8">SCHEME</th><th style="padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:#94a3b8">DUE</th><th style="padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:#94a3b8">STATUS</th><th style="padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:#94a3b8">TEAMS</th><th style="padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:#94a3b8">SUBS</th></tr></thead><tbody>'+attRows+'</tbody></table></div></body></html>';
  downloadHtml('AttestHub-Dashboard-'+today+'.html', html);
}

      // Sub-items section
      if (!item.subItems) item.subItems = [];
      var subSec = h('div',{style:{borderTop:'1px solid #e2e8f0',marginTop:'10px',paddingTop:'10px'}});
      subSec.appendChild(h('p',{style:{fontSize:'10px',fontWeight:'700',color:'#7A5F00',letterSpacing:'0.5px',marginBottom:'2px'}},'COMPLIANCE CHECKLIST'));
      subSec.appendChild(h('p',{style:{fontSize:'10px',color:'#5C4800',marginBottom:'6px'}},'Specific compliance requirements the submitter must confirm for this question'));
      (item.subItems||[]).forEach(function(si,si_i){
        var siRow = h('div',{style:{display:'flex',gap:'6px',alignItems:'center',marginBottom:'6px'}});
        var siIn = h('input',{type:'text',placeholder:'Sub-item text',style:Object.assign({},inputStyle,{flex:'1',fontSize:'12px',padding:'6px 10px'})});
        siIn.value = si.text;
        siIn.addEventListener('input',function(){state.newAtt.checklist[i].subItems[si_i].text=this.value;});
        siRow.appendChild(siIn);
        siRow.appendChild(h('button',Object.assign({style:{width:'24px',height:'24px',borderRadius:'4px',border:'none',background:'#fee2e2',color:'#dc2626',cursor:'pointer',fontSize:'12px',flexShrink:'0'}},(function(siId){return {onClick:function(){state.newAtt.checklist[i].subItems=state.newAtt.checklist[i].subItems.filter(function(x){return x.id!==siId;});render();}};})(si.id)),'✕'));
        subSec.appendChild(siRow);
      });
      subSec.appendChild(h('button',Object.assign({style:{fontSize:'11px',color:'#7A5F00',border:'1px dashed #FFD000',background:'#FFFDE7',borderRadius:'6px',padding:'4px 10px',cursor:'pointer'}},(function(iIdx){return {onClick:function(){if(!state.newAtt.checklist[iIdx].subItems)state.newAtt.checklist[iIdx].subItems=[];state.newAtt.checklist[iIdx].subItems.push({id:'si-'+Date.now(),text:''});render();}};})(i)),'＋ Add compliance item'));
      row.appendChild(subSec);
      clf.appendChild(row);
    });
    clf.appendChild(h('button',{style:{fontSize:'12px',color:'#7A5F00',border:'1px dashed #FFD000',background:'#FFFDE7',borderRadius:'8px',padding:'6px 14px',cursor:'pointer',width:'100%'},
      onClick:function(){state.newAtt.checklist.push({id:'c-'+Date.now(),title:'',desc:'',type:'both',req:true,subItems:[]});render();}
    },'＋ Add question'));
    form.appendChild(clf);

    // Buttons
    form.appendChild(h('div',{style:{display:'flex',justifyContent:'flex-end',gap:'8px',marginTop:'20px',paddingTop:'16px',borderTop:'1px solid #f1f5f9'}},[
      h('button',{style:{padding:'8px 16px',fontSize:'13px',border:'1px solid #e2e8f0',borderRadius:'8px',background:'#fff',color:'#475569',cursor:'pointer'},
        onClick:function(){state.showCreateAtt=false;state.newAtt={name:'',scheme:'AusPayNet',due:'',desc:'',teams:[],checklist:[]};state.importFromLastYearId='';render();}
      },'Cancel'),
      h('button',{style:{padding:'8px 20px',fontSize:'13px',fontWeight:'600',border:'none',borderRadius:'8px',background:'#FFD000',color:'#1A1A1A',cursor:'pointer'},
        onClick:function(){
          if (!state.newAtt.name.trim()) { alert('Attestation name is required.'); return; }
          var newAtt = {
            id:'a-'+Date.now(),
            name:state.newAtt.name.trim(),
            scheme:state.newAtt.scheme,
            due:state.newAtt.due,
            desc:state.newAtt.desc.trim(),
            teams:state.newAtt.teams.slice(),
            checklist:state.newAtt.checklist.map(function(item){return {id:item.id,title:item.title,desc:item.desc,type:item.type,req:item.req,teams:item.teams||[],subItems:(item.subItems||[]).map(function(si){return {id:si.id,text:si.text};})};})
          };
          state.attestations.push(newAtt);
          state.newAtt.teams.forEach(function(uid){
            var user = state.users.find(function(u){return u.id===uid;});
            if (user && user.atts.indexOf(newAtt.id)<0) user.atts.push(newAtt.id);
          });
          saveAttestations(); saveUsers();
          state.newAtt = {name:'',scheme:'AusPayNet',due:'',desc:'',teams:[],checklist:[]}; state.newTeamName=''; state.importFromLastYearId='';
          state.showCreateAtt = false;
          render();
        }
      },'Create Attestation')
    ]));
    wrap.appendChild(form);
  }

  // Existing attestation list
  state.attestations.forEach(function(att) {
    var card = h('div',{style:{background:'#fff',borderRadius:'12px',border:'1px solid #f1f5f9',padding:'16px',marginBottom:'12px'}});
    var schemeC = att.scheme==='AP+'?{bg:'#faf5ff',c:'#7c3aed',b:'#ddd6fe'}:{bg:'#eff6ff',c:'#2563eb',b:'#bfdbfe'};
    card.appendChild(h('span',{style:{fontSize:'11px',padding:'2px 8px',borderRadius:'20px',background:schemeC.bg,color:schemeC.c,border:'1px solid '+schemeC.b}},att.scheme));
    card.appendChild(h('p',{style:{fontWeight:'600',fontSize:'14px',color:'#1e293b',marginTop:'6px'}},att.name));
    card.appendChild(h('p',{style:{fontSize:'11px',color:'#94a3b8'}},'Due '+fmtDate(att.due)+' · '+att.checklist.length+' checklist items · '+att.teams.length+' teams'));

    var details = h('div',{style:{marginTop:'12px',paddingTop:'12px',borderTop:'1px solid #f1f5f9'}});
    details.appendChild(h('p',{style:{fontSize:'10px',fontWeight:'700',color:'#94a3b8',letterSpacing:'0.5px',marginBottom:'8px'}},'CHECKLIST'));
    att.checklist.forEach(function(ci,i){
      details.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:'8px',fontSize:'12px',padding:'4px 0',color:'#475569'}},[
        h('span',{style:{width:'18px',height:'18px',borderRadius:'50%',background:'#e2e8f0',color:'#64748b',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'9px',flexShrink:'0'}},String(i+1)),
        h('span',{style:{fontWeight:'500'}},ci.title),
        ci.req?h('span',{style:{color:'#f87171'}},'*'):null,
        h('span',{style:{color:'#cbd5e1',marginLeft:'auto',fontSize:'10px',textTransform:'capitalize'}},ci.type)
      ]));
    });
    card.appendChild(details);

    var teamSec = h('div',{style:{marginTop:'12px',paddingTop:'12px',borderTop:'1px solid #f1f5f9'}});
    teamSec.appendChild(h('p',{style:{fontSize:'10px',fontWeight:'700',color:'#94a3b8',letterSpacing:'0.5px',marginBottom:'6px'}},'ASSIGNED TEAMS'));
    var teamNames = att.teams.map(function(tid){var u=state.users.find(function(u){return u.id===tid}); return u?u.name:tid;}).join(', ');
    teamSec.appendChild(h('p',{style:{fontSize:'12px',color:'#475569'}},teamNames || 'None'));
    card.appendChild(teamSec);

    // Export footer
    var exportFoot = h('div',{style:{marginTop:'12px',paddingTop:'12px',borderTop:'1px solid #f1f5f9',display:'flex',justifyContent:'flex-end'}});
    exportFoot.appendChild(h('button',{style:{padding:'6px 14px',fontSize:'12px',fontWeight:'600',border:'1px solid #FFD000',borderRadius:'8px',background:'#FFFDE7',color:'#7A5F00',cursor:'pointer'},
      onClick:(function(a){return function(){exportFinalAttestationDoc(a);};})(att)
    },'📄 Export Final Document'));
    card.appendChild(exportFoot);

    wrap.appendChild(card);
  });
  return wrap;
}

// ═══════════ ADMIN USERS ═══════════
function renderAdminUsers() {
  var wrap = h('div',{style:{padding:'28px',maxWidth:'700px'}});
  var inputStyle = {border:'1px solid #e2e8f0',borderRadius:'8px',padding:'10px 12px',fontSize:'13px',width:'100%',fontFamily:'inherit',outline:'none',boxSizing:'border-box'};
  var labelStyle = {fontSize:'11px',fontWeight:'600',color:'#64748b',display:'block',marginBottom:'4px'};

  // Header row
  var hdr = h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'24px'}});
  hdr.appendChild(h('div',{},[
    h('h1',{style:{fontSize:'20px',fontWeight:'700',marginBottom:'2px'}},'Team Management'),
    h('p',{style:{fontSize:'13px',color:'#64748b'}},'Manage users and attestation assignments')
  ]));
  hdr.appendChild(h('button',{style:{
    padding:'8px 16px',fontSize:'13px',fontWeight:'600',border:'none',borderRadius:'8px',
    background:state.showCreateUser?'#f1f5f9':'#FFD000',color:state.showCreateUser?'#475569':'#1A1A1A',cursor:'pointer'
  },onClick:function(){
    state.showCreateUser = !state.showCreateUser;
    if (!state.showCreateUser) state.newUser = {name:'',role:'crew',atts:[]};
    render();
  }},state.showCreateUser?'✕ Cancel':'＋ Add Member'));
  wrap.appendChild(hdr);

  // Create form
  if (state.showCreateUser) {
    var form = h('div',{style:{background:'#fff',borderRadius:'12px',border:'2px solid #FFD000',padding:'20px',marginBottom:'20px'}});
    form.appendChild(h('p',{style:{fontSize:'13px',fontWeight:'700',color:'#1e293b',marginBottom:'16px'}},'New Member'));

    // Name
    var nf = h('div',{style:{marginBottom:'14px'}});
    nf.appendChild(h('label',{style:labelStyle},'Name *'));
    var nameIn = h('input',{type:'text',placeholder:'e.g. Fraud & Risk Team',style:inputStyle});
    nameIn.value = state.newUser.name;
    nameIn.addEventListener('input',function(){state.newUser.name=this.value;});
    nf.appendChild(nameIn);
    form.appendChild(nf);

    // Role
    var rf = h('div',{style:{marginBottom:'14px'}});
    rf.appendChild(h('label',{style:labelStyle},'Role'));
    var roleEl = h('select',{style:inputStyle});
    [{v:'crew',l:'Crew'},{v:'reviewer',l:'Reviewer'},{v:'admin',l:'Admin'}].forEach(function(o){
      var opt = h('option',{value:o.v},o.l);
      if (state.newUser.role===o.v) opt.selected = true;
      roleEl.appendChild(opt);
    });
    roleEl.addEventListener('change',function(){state.newUser.role=this.value;});
    rf.appendChild(roleEl);
    form.appendChild(rf);

    // Assign Attestations
    if (state.attestations.length) {
      var af = h('div',{style:{marginBottom:'14px'}});
      af.appendChild(h('label',{style:labelStyle},'Assign Attestations'));
      state.attestations.forEach(function(att){
        var checked = state.newUser.atts.indexOf(att.id) >= 0;
        var lbl = h('label',{style:{display:'flex',alignItems:'center',gap:'8px',fontSize:'13px',color:'#475569',marginBottom:'6px',cursor:'pointer'}});
        var cb = h('input',{type:'checkbox'});
        cb.checked = checked;
        cb.addEventListener('change',function(){
          if (this.checked) state.newUser.atts.push(att.id);
          else state.newUser.atts = state.newUser.atts.filter(function(id){return id!==att.id;});
        });
        lbl.appendChild(cb);
        lbl.appendChild(document.createTextNode(att.name));
        af.appendChild(lbl);
      });
      form.appendChild(af);
    }

    // Buttons
    form.appendChild(h('div',{style:{display:'flex',justifyContent:'flex-end',gap:'8px',marginTop:'20px',paddingTop:'16px',borderTop:'1px solid #f1f5f9'}},[
      h('button',{style:{padding:'8px 16px',fontSize:'13px',border:'1px solid #e2e8f0',borderRadius:'8px',background:'#fff',color:'#475569',cursor:'pointer'},
        onClick:function(){state.showCreateUser=false;state.newUser={name:'',role:'crew',atts:[]};render();}
      },'Cancel'),
      h('button',{style:{padding:'8px 20px',fontSize:'13px',fontWeight:'600',border:'none',borderRadius:'8px',background:'#FFD000',color:'#1A1A1A',cursor:'pointer'},
        onClick:function(){
          if (!state.newUser.name.trim()) { alert('Name is required.'); return; }
          var newUser = {id:'u-'+Date.now(),name:state.newUser.name.trim(),role:state.newUser.role,atts:state.newUser.atts.slice()};
          state.users.push(newUser);
          state.newUser.atts.forEach(function(attId){
            var att = state.attestations.find(function(a){return a.id===attId;});
            if (att && att.teams.indexOf(newUser.id)<0) att.teams.push(newUser.id);
          });
          saveUsers(); saveAttestations();
          state.newUser = {name:'',role:'crew',atts:[]};
          state.showCreateUser = false;
          render();
        }
      },'Add Member')
    ]));
    wrap.appendChild(form);
  }

  // Existing user list
  state.users.forEach(function(u) {
    var colors = {admin:'#6366f1',reviewer:'#14b8a6',crew:'#64748b'};
    var card = h('div',{style:{background:'#fff',borderRadius:'12px',border:'1px solid #f1f5f9',padding:'14px 16px',marginBottom:'8px',display:'flex',alignItems:'center',gap:'12px'}});
    card.appendChild(h('div',{style:{width:'32px',height:'32px',borderRadius:'50%',background:colors[u.role],color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:'700',fontSize:'11px',flexShrink:'0'}},u.name.slice(0,2).toUpperCase()));
    card.appendChild(h('div',{style:{flex:'1',minWidth:'0'}},[
      h('div',{style:{fontWeight:'600',fontSize:'13px',color:'#1e293b'}},u.name),
      h('div',{style:{fontSize:'11px',color:'#94a3b8',textTransform:'capitalize'}},u.role+' · '+u.atts.length+' attestation(s)')
    ]));
    wrap.appendChild(card);
  });
  return wrap;
}

// Boot
initState();
render();
</script>
</body>
</html>
