// ═══════════ PERSISTENCE ═══════════
function saveSubmissions() {
  // file data (data URLs) is stripped to stay within the localStorage quota
  var toSave = state.submissions.map(function(s) {
    return {id:s.id,attId:s.attId,questionId:s.questionId,taskId:s.taskId,teamId:s.teamId,
            at:s.at,status:s.status,ai:s.ai,review:s.review,versions:s.versions||[],
            evidence:{text:(s.evidence&&s.evidence.text)||'',files:[]}};
  });
  try { localStorage.setItem('attesthub_submissions',JSON.stringify(toSave)); } catch(e) {}
}

function loadSubmissions() {
  try {
    var raw = localStorage.getItem('attesthub_submissions');
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function saveAttestations() {
  try { localStorage.setItem('attesthub_attestations',JSON.stringify(state.attestations)); } catch(e) {}
}
function loadAttestations() {
  try { var r=localStorage.getItem('attesthub_attestations'); return r?JSON.parse(r):null; } catch(e) { return null; }
}
function saveUsers() {
  try { localStorage.setItem('attesthub_users',JSON.stringify(state.users)); } catch(e) {}
}
function loadUsers() {
  try { var r=localStorage.getItem('attesthub_users'); return r?JSON.parse(r):null; } catch(e) { return null; }
}

function initState() {
  var savedAtts = loadAttestations();
  if (savedAtts && savedAtts.length > 0) state.attestations = savedAtts.map(migrateAttestation);
  var savedUsers = loadUsers();
  if (savedUsers && savedUsers.length > 0) state.users = savedUsers;

  var saved = loadSubmissions();
  if (saved && saved.length > 0) {
    // keep only new task-level submissions; legacy per-attestation submissions are dropped on upgrade
    state.submissions = saved.filter(function(s){ return s.taskId; });
  }
  // run the heuristic compliance check on any task that lacks a result
  state.submissions.forEach(function(s) {
    var att = state.attestations.find(function(a){ return a.id===s.attId; });
    var q = att && (att.questions||[]).find(function(x){ return x.id===s.questionId; });
    var task = q && (q.tasks||[]).find(function(x){ return x.id===s.taskId; });
    if (task && !s.ai) s.ai = evaluateTask(task, s.evidence||{});
  });
}

// ═══════════ TASK MODEL & COMPLIANCE ENGINE ═══════════
// Migrate any legacy attestation (checklist/subItems) into questions/tasks
function migrateAttestation(a) {
  if (a.questions) return a;
  var teams = a.teams || [];
  var questions = (a.checklist || []).map(function(ci) {
    var ev = ci.type==='text'?['text']:ci.type==='screenshot'?['screenshot']:['text','screenshot'];
    var tasks;
    if (ci.subItems && ci.subItems.length) {
      tasks = ci.subItems.map(function(si, ix) {
        return {id:'t'+(ix+1),title:si.text||('Task '+(ix+1)),instructions:ci.desc||'',teamId:teams[0]||null,evidence:ev,required:ci.req!==false,criteria:[]};
      });
    } else {
      tasks = [{id:'t1',title:ci.title,instructions:ci.desc||'',teamId:teams[0]||null,evidence:ev,required:ci.req!==false,due:ci.due||null,criteria:[]}];
    }
    return {id:ci.id,title:ci.title,desc:ci.desc||'',tasks:tasks};
  });
  return {id:a.id,name:a.name,scheme:a.scheme,due:a.due,desc:a.desc,questions:questions,riskReports:a.riskReports||[]};
}

// Flatten every task with its parent question
function attTasks(att) {
  var out = [];
  (att.questions || []).forEach(function(q) {
    (q.tasks || []).forEach(function(t) { out.push({q:q, task:t}); });
  });
  return out;
}
function teamsForAtt(att) {
  var set = {};
  attTasks(att).forEach(function(p) { if (p.task.teamId) set[p.task.teamId] = true; });
  return Object.keys(set);
}

// ── Heuristic compliance evaluator (Claude-ready: same criteria shape an LLM will score) ──
function checkCriterion(rule, ev) {
  var text = (ev.text || '').trim();
  var words = text ? text.split(/\s+/).length : 0;
  var hasFiles = (ev.files || []).length > 0;
  if (!rule) return {met: words>0 || hasFiles, note:''};
  switch (rule.type) {
    case 'minWords': {
      var n = rule.n || 40;
      return {met: words>=n, note: words<n ? ('Only '+words+' words — expected at least '+n) : ''};
    }
    case 'keyword': {
      var lc = text.toLowerCase();
      var hit = (rule.any||[]).some(function(k){ return lc.indexOf(String(k).toLowerCase())>=0; });
      return {met: hit, note: hit ? '' : 'No mention of: '+(rule.any||[]).join(', ')};
    }
    case 'date': {
      var d = /(\b\d{1,2}[\/\-\s][A-Za-z0-9]{2,9}[\/\-\s]\d{2,4}\b|\b\d{4}-\d{2}-\d{2}\b|\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{4}\b)/i.test(text);
      return {met: d, note: d ? '' : 'No clear date found in the evidence'};
    }
    case 'number': {
      var num = /\d/.test(text);
      return {met: num, note: num ? '' : 'No figures or counts found'};
    }
    case 'screenshot':
      return {met: hasFiles, note: hasFiles ? '' : 'No screenshot / file attached'};
    default:
      return {met: words>0 || hasFiles, note:''};
  }
}
function evaluateTask(task, ev) {
  ev = ev || {text:'', files:[]};
  var results = (task.criteria || []).map(function(c) {
    var r = checkCriterion(c.rule, ev);
    return {id:c.id, text:c.text, met:!!r.met, note:r.note||''};
  });
  var total = results.length;
  var met = results.filter(function(r){ return r.met; }).length;
  var hasEvidence = (ev.text && ev.text.trim()) || (ev.files||[]).length>0;
  var compliant = total===0 ? !!hasEvidence : met===total;
  var score = total===0 ? (compliant?100:0) : Math.round(met/total*100);
  return {compliant:compliant, score:score, met:met, total:total, results:results, evaluatedAt:new Date().toISOString()};
}

// ── Lookups & status rollups ──
function getTaskSub(attId, qId, taskId, teamId) {
  return state.submissions.find(function(s) {
    return s.attId===attId && s.questionId===qId && s.taskId===taskId && (!teamId || s.teamId===teamId);
  });
}
// Task status: not_started → in_progress → submitted (under review) → compliant | needs_work
function getTaskStatus(att, q, task) {
  var sub = getTaskSub(att.id, q.id, task.id, task.teamId);
  if (!sub) return 'not_started';
  if (sub.status==='compliant') return 'compliant';
  if (sub.status==='needs_work') return 'needs_work';
  if (sub.status==='submitted') return 'submitted';
  var ev = sub.evidence || {};
  return ((ev.text && ev.text.trim()) || (ev.files||[]).length>0) ? 'in_progress' : 'not_started';
}
var TASK_STATUS_META = {
  not_started:{label:'Not started',color:'#646B76',bg:'#EDEFF2',dot:'#9098A2'},
  in_progress:{label:'In progress',color:'#7A5B00',bg:'#FFF8E1',dot:'#FFC400'},
  submitted:{label:'Under review',color:'#2A5BD7',bg:'#E8EEFC',dot:'#2A5BD7'},
  needs_work:{label:'Needs work',color:'#C0362C',bg:'#FBEAE8',dot:'#C0362C'},
  compliant:{label:'Compliant',color:'#127A56',bg:'#E6F4EE',dot:'#127A56'}
};
// Question rolls up from its required tasks
function getQuestionStatus(att, q) {
  var req = (q.tasks||[]).filter(function(t){ return t.required!==false; });
  var pool = req.length ? req : (q.tasks||[]);
  if (!pool.length) return 'not_started';
  if (pool.every(function(t){ return getTaskStatus(att,q,t)==='compliant'; })) return 'compliant';
  if ((q.tasks||[]).some(function(t){ return getTaskStatus(att,q,t)==='needs_work'; })) return 'needs_work';
  if ((q.tasks||[]).some(function(t){ return getTaskStatus(att,q,t)==='submitted'; })) return 'submitted';
  if ((q.tasks||[]).some(function(t){ var s=getTaskStatus(att,q,t); return s==='in_progress'||s==='compliant'; })) return 'in_progress';
  return 'not_started';
}
// Attestation tally of task statuses (optionally scoped to one team)
function getAttRollup(att, opts) {
  opts = opts || {};
  var tally = {not_started:0, in_progress:0, submitted:0, needs_work:0, compliant:0, total:0};
  attTasks(att).forEach(function(p) {
    if (opts.teamId && p.task.teamId!==opts.teamId) return;
    var st = getTaskStatus(att, p.q, p.task);
    tally[st] = (tally[st]||0) + 1;
    tally.total++;
  });
  return tally;
}
// Tasks awaiting a reviewer (submitted) for an attestation
function reviewQueueCount(att) {
  return attTasks(att).filter(function(p){ return getTaskStatus(att,p.q,p.task)==='submitted'; }).length;
}

function icon(name, size, color, stroke) {
  var s = size || 16;
  var el = document.createElementNS('http://www.w3.org/2000/svg','svg');
  el.setAttribute('width', s); el.setAttribute('height', s); el.setAttribute('viewBox','0 0 24 24');
  el.setAttribute('fill','none'); el.setAttribute('stroke', color || 'currentColor');
  el.setAttribute('stroke-width', stroke || 1.75);
  el.setAttribute('stroke-linecap','round'); el.setAttribute('stroke-linejoin','round');
  el.style.flexShrink = '0'; el.style.display = 'inline-block'; el.style.verticalAlign = 'middle';
  el.innerHTML = ICONS[name] || '';
  return el;
}
function iconStr(name, size, color) {
  var s = size || 14;
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="'+(color||'currentColor')+'" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;flex-shrink:0">'+(ICONS[name]||'')+'</svg>';
}

// ═══════════ RENDER ENGINE ═══════════
function h(tag, attrs, children) {
  var el = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k) {
    if (k === 'style' && typeof attrs[k] === 'object') {
      Object.keys(attrs[k]).forEach(function(s){ el.style[s] = attrs[k][s]; });
    } else if (k.indexOf('on')===0) {
      el.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    } else if (k === 'className') {
      el.className = attrs[k];
    } else if (k === 'value') {
      el.value = attrs[k];
    } else if (k === 'placeholder') {
      el.placeholder = attrs[k];
    } else if (k === 'type') {
      el.type = attrs[k];
    } else if (k === 'checked') {
      el.checked = attrs[k];
    } else if (k === 'htmlFor') {
      el.htmlFor = attrs[k];
    } else if (k === 'multiple') {
      el.multiple = attrs[k];
    } else if (k === 'accept') {
      el.accept = attrs[k];
    } else if (k === 'disabled') {
      el.disabled = attrs[k];
    } else if (k === 'selected') {
      el.selected = attrs[k];
    } else if (k === 'src') {
      el.src = attrs[k];
    } else {
      el.setAttribute(k, attrs[k]);
    }
  });
  if (children !== undefined && children !== null) {
    if (Array.isArray(children)) {
      children.forEach(function(c) {
        if (c === null || c === undefined) return;
        if (typeof c === 'string' || typeof c === 'number') el.appendChild(document.createTextNode(c));
        else el.appendChild(c);
      });
    } else if (typeof children === 'string' || typeof children === 'number') {
      el.appendChild(document.createTextNode(children));
    } else {
      el.appendChild(children);
    }
  }
  return el;
}

function renderMain() {

  var main = h('div',{style:{flex:'1',overflowY:'auto',background:'var(--bg)'}});

  // Defensive guard: a render error shows a notice instead of a blank screen.
  function safe(name, fn){ try { return fn(); } catch(e){ console.error(name, e); return errorNotice(name, e); } }
  if (state.view==='dashboard') main.appendChild(safe('Dashboard', renderDashboard));
  else if (state.view==='history') main.appendChild(safe('History', renderHistory));
  else if (state.view==='submit') main.appendChild(safe('Task', renderSubmit));
  else if (state.view==='attestation') main.appendChild(safe('Attestation', renderAttestation));
  else if (state.view==='review') main.appendChild(safe('Review', renderReview));
  else if (state.view==='admin-atts' && isAdminView) main.appendChild(safe('Attestations', renderAdminAtts));
  else { state.view='dashboard'; main.appendChild(safe('Dashboard', renderDashboard)); }

  wrap.appendChild(main);
  return wrap;
}

function upsertTaskSub(att,q,task,teamId,evidence,status){
  var sub=getTaskSub(att.id,q.id,task.id,teamId);
  if(!sub){ sub={id:'sub-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),attId:att.id,questionId:q.id,taskId:task.id,teamId:teamId,versions:[]}; state.submissions.push(sub); }
  var prevText=(sub.evidence&&sub.evidence.text)||'';
  var newText=evidence.text||'';
  sub.evidence={text:newText,files:(evidence.files||[]).slice()};
  sub.at=new Date().toISOString();
  sub.status=status;
  if(status==='submitted'){ sub.ai=evaluateTask(task,sub.evidence); sub.review=null; }
  sub.versions=sub.versions||[];
  sub.versions.push({vNum:sub.versions.length+1,savedAt:sub.at,savedBy:(state.currentUser&&state.currentUser.name)||'',status:status,text:newText,prevText:prevText,fileCount:(evidence.files||[]).length});
  saveSubmissions();
  return sub;
}

// Word-level diff (LCS) for change-tracking → array of {type:'same'|'add'|'del', text}
function wordDiff(oldStr, newStr){
  var a=String(oldStr||'').split(/(\s+)/), b=String(newStr||'').split(/(\s+)/);
  var n=a.length, m=b.length;
  var dp=[]; for(var i=0;i<=n;i++){ dp[i]=[]; for(var j=0;j<=m;j++) dp[i][j]=0; }
  for(var i2=n-1;i2>=0;i2--) for(var j2=m-1;j2>=0;j2--) dp[i2][j2]=a[i2]===b[j2]?dp[i2+1][j2+1]+1:Math.max(dp[i2+1][j2],dp[i2][j2+1]);
  var out=[], x=0, y=0;
  while(x<n&&y<m){
    if(a[x]===b[y]){ out.push({type:'same',text:a[x]}); x++; y++; }
    else if(dp[x+1][y]>=dp[x][y+1]){ out.push({type:'del',text:a[x]}); x++; }
    else { out.push({type:'add',text:b[y]}); y++; }
  }
  while(x<n){ out.push({type:'del',text:a[x++]}); }
  while(y<m){ out.push({type:'add',text:b[y++]}); }
  return out;
}

  var wrap=h('div',{style:{padding:'28px',maxWidth:'880px'}});
  wrap.appendChild(h('h1',{style:{fontSize:'21px',fontWeight:'700',letterSpacing:'-0.4px',marginBottom:'2px'}},'History'));
  wrap.appendChild(h('p',{style:{fontSize:'13px',color:'var(--muted)',marginBottom:'22px'}},isCrew?'Your task submissions.':'All task submissions across teams.'));
  var subs=state.submissions.filter(function(s){return isCrew?s.teamId===u.id:true;}).slice();
  subs.sort(function(a,b){return new Date(b.at||0)-new Date(a.at||0);});
  if(!subs.length){ wrap.appendChild(emptyCard('No submissions yet.')); return wrap; }
  subs.forEach(function(s){
    var att=state.attestations.find(function(a){return a.id===s.attId;}); if(!att)return;
    var q=(att.questions||[]).find(function(x){return x.id===s.questionId;}); var task=q&&(q.tasks||[]).find(function(x){return x.id===s.taskId;});
    if(!q||!task)return;
    var team=state.users.find(function(tu){return tu.id===s.teamId;});
    var st=getTaskStatus(att,q,task);
    var card=h('div',{style:{display:'flex',alignItems:'center',gap:'12px',background:'#fff',borderRadius:'12px',border:'1px solid var(--border)',boxShadow:'var(--shadow-sm)',padding:'14px 16px',marginBottom:'8px',cursor:'pointer'},
      onClick:(function(a,qq,tt){return function(){openTask(a,qq,tt,'review');};})(att,q,task)});
    card.appendChild(h('div',{style:{flex:'1',minWidth:'0'}},[
      h('div',{style:{fontSize:'13px',fontWeight:'600',color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},task.title),
      h('div',{className:'tnum',style:{fontSize:'11px',color:'var(--faint)',marginTop:'1px'}},att.name+' · '+q.title+' · '+(team?team.name:'—')+' · '+fmtDate(s.at))
    ]));
    if(s.ai) card.appendChild(h('span',{className:'tnum',style:{fontSize:'11px',color:'var(--muted)',flexShrink:'0'}},s.ai.met+'/'+s.ai.total));
    card.appendChild(taskStatusPill(st));
    wrap.appendChild(card);
  });
  return wrap;
}

// ═══════════ CREW: SUBMIT A TASK ═══════════
function renderSubmit(){
  var att=state.selectedAtt,q=state.selectedQuestion,task=state.selectedTask;
  if(!att||!q||!task){ var w0=h('div',{style:{padding:'28px'}}); w0.appendChild(backBtn('Back to my tasks',function(){state.view='dashboard';render();})); w0.appendChild(emptyCard('Task not found.')); return w0; }
  var sub=getTaskSub(att.id,q.id,task.id,task.teamId);
  var work={text:(sub&&sub.evidence&&sub.evidence.text)||'', files:(sub&&sub.evidence&&sub.evidence.files)?sub.evidence.files.slice():[]};

  function build(){
    var wrap=h('div',{style:{padding:'28px',maxWidth:'760px'}});
    wrap.appendChild(backBtn('Back to my tasks',function(){state.view='dashboard';render();}));
    wrap.appendChild(h('p',{style:{fontSize:'11px',color:'var(--faint)',marginBottom:'4px'}},att.name+' · '+q.title));
    wrap.appendChild(h('h2',{style:{fontSize:'18px',fontWeight:'700',marginBottom:'4px'}},task.title));
    if(task.instructions) wrap.appendChild(h('p',{style:{fontSize:'13px',color:'var(--muted)',marginBottom:'18px',lineHeight:'1.5'}},task.instructions));

    var card=h('div',{style:{background:'#fff',borderRadius:'14px',border:'1px solid var(--border)',boxShadow:'var(--shadow-sm)',padding:'20px',marginBottom:'16px'}});
    var ev=task.evidence||['text'];
    if(ev.indexOf('text')>=0){
      card.appendChild(h('label',{style:{fontSize:'11px',fontWeight:'600',color:'var(--muted)',display:'block',marginBottom:'5px'}},'Text response'));
      var ta=h('textarea',{style:{width:'100%',height:'130px',border:'1px solid var(--border)',borderRadius:'8px',padding:'11px',fontSize:'13px',resize:'none',fontFamily:'inherit',outline:'none',boxSizing:'border-box'},placeholder:'Provide specific dates, figures, tools, and outcomes.'});
      ta.value=work.text; ta.addEventListener('input',function(){work.text=this.value;});
      card.appendChild(ta);
    }
    if(ev.indexOf('screenshot')>=0||ev.indexOf('document')>=0){
      card.appendChild(h('label',{style:{fontSize:'11px',fontWeight:'600',color:'var(--muted)',display:'block',margin:'14px 0 5px'}},'Attachments'));
      var fileInput=h('input',{type:'file',accept:ev.indexOf('document')>=0?'image/*,application/pdf':'image/*',multiple:true,style:{display:'none'}});
      fileInput.addEventListener('change',function(){ Array.from(this.files).forEach(function(f){ var rd=new FileReader(); rd.onload=function(e){ work.files.push({name:f.name,data:e.target.result}); wrap.parentNode.replaceChild(build(),wrap); }; rd.readAsDataURL(f); }); });
      var dz=h('label',{style:{display:'flex',alignItems:'center',justifyContent:'center',gap:'8px',border:'2px dashed var(--border-strong)',borderRadius:'8px',padding:'16px',cursor:'pointer',fontSize:'13px',color:'var(--faint)'}},[icon('upload',17,'#9098A2'),h('span',{},'Click to upload evidence'),fileInput]);
      card.appendChild(dz);
      if(work.files.length){
        var grid=h('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px',marginTop:'8px'}});
        work.files.forEach(function(f,fi){
          var isImg=/^data:image/.test(f.data);
          grid.appendChild(h('div',{style:{borderRadius:'8px',overflow:'hidden',border:'1px solid var(--border)',position:'relative'}},[
            isImg?h('img',{src:f.data,style:{width:'100%',height:'58px',objectFit:'cover',display:'block'}}):h('div',{style:{height:'58px',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg-sub)'}},icon('fileText',20,'#9098A2')),
            h('button',{style:{position:'absolute',top:'4px',right:'4px',width:'18px',height:'18px',borderRadius:'50%',background:'#C0362C',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'},onClick:(function(idx){return function(){work.files.splice(idx,1);wrap.parentNode.replaceChild(build(),wrap);};})(fi)},icon('x',11,'#fff',2.5)),
            h('p',{style:{fontSize:'9px',color:'var(--faint)',padding:'2px 4px',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},f.name)
          ]));
        });
        card.appendChild(grid);
      }
    }
    wrap.appendChild(card);

    if((task.criteria||[]).length){
      var res=evaluateTask(task,work);
      var pc=h('div',{style:{background:'#fff',borderRadius:'14px',border:'1px solid var(--border)',boxShadow:'var(--shadow-sm)',padding:'18px',marginBottom:'16px'}});
      pc.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}},[
        h('p',{style:{display:'flex',alignItems:'center',gap:'7px',fontSize:'10px',fontWeight:'700',color:'var(--accent-deep)',letterSpacing:'.5px'}},[icon('sparkles',14,'#7A5B00'),h('span',{},'COMPLIANCE PREVIEW')]),
        h('span',{className:'tnum',style:{fontSize:'12px',fontWeight:'700',color:res.compliant?'#127A56':'var(--muted)'}},res.met+'/'+res.total+' met')
      ]));
      res.results.forEach(function(r){ pc.appendChild(h('div',{style:{display:'flex',alignItems:'flex-start',gap:'8px',fontSize:'12px',padding:'4px 0',color:r.met?'#127A56':'var(--muted)'}},[ h('span',{style:{flexShrink:'0',display:'flex',marginTop:'1px'}},icon(r.met?'check':'minus',14,r.met?'#127A56':'#C2C7CF')), h('span',{},r.text+(r.note&&!r.met?' — '+r.note:'')) ])); });
      pc.appendChild(h('p',{style:{fontSize:'10px',color:'var(--faint)',marginTop:'8px'}},'Re-checks each time you add evidence. A reviewer makes the final decision.'));
      wrap.appendChild(pc);
    }

    var btns=h('div',{style:{display:'flex',justifyContent:'flex-end',gap:'8px'}});
    btns.appendChild(h('button',{style:{padding:'9px 16px',fontSize:'13px',fontWeight:'600',border:'1px solid var(--border-strong)',borderRadius:'9px',background:'#fff',color:'#475569',cursor:'pointer'},
      onClick:function(){ upsertTaskSub(att,q,task,task.teamId,work,'in_progress'); state.view='dashboard'; render(); }},'Save draft'));
    btns.appendChild(h('button',{style:{display:'inline-flex',alignItems:'center',gap:'6px',padding:'9px 20px',fontSize:'13px',fontWeight:'600',border:'none',borderRadius:'9px',background:'var(--accent)',color:'#16181D',cursor:'pointer'},
      onClick:function(){ if(!((work.text&&work.text.trim())||work.files.length)){alert('Please add some evidence before submitting.');return;} upsertTaskSub(att,q,task,task.teamId,work,'submitted'); state.view='dashboard'; render(); }},[icon('check',15,'#16181D'),h('span',{},'Submit for review')]));
    wrap.appendChild(btns);
    return wrap;
  }
  return build();
}

// ═══════════ REVIEWER: ATTESTATION DRILL-IN ═══════════

      h('div',{style:{flex:'1',minWidth:'0'}},[ h('div',{style:{fontWeight:'600',fontSize:'14px',color:'var(--text)'}},q.title), q.desc?h('div',{style:{fontSize:'11px',color:'var(--faint)'}},q.desc):null ]),
      taskStatusPill(qSt)
    ]));
    (q.tasks||[]).forEach(function(t){
      var st=getTaskStatus(att,q,t); var team=state.users.find(function(x){return x.id===t.teamId;}); var sub=getTaskSub(att.id,q.id,t.id,t.teamId);
      var canReview=(u.role==='admin'||u.role==='reviewer');

        h('div',{style:{fontSize:'11px',color:'var(--faint)'}},team?team.name:'Unassigned')
      ]));
      if(sub&&sub.ai) row.appendChild(h('span',{className:'tnum',style:{fontSize:'11px',color:'var(--muted)',flexShrink:'0'}},sub.ai.met+'/'+sub.ai.total));
      row.appendChild(taskStatusPill(st));

      if(actLabel) row.appendChild(h('button',{style:{padding:'6px 13px',borderRadius:'8px',border:'none',fontSize:'12px',fontWeight:'600',cursor:'pointer',background:st==='submitted'?'var(--accent)':'#EDEFF2',color:st==='submitted'?'#16181D':'#475569',flexShrink:'0'},
        onClick:(function(qq,tt){return function(){openTask(att,qq,tt,'review');};})(q,t)},actLabel));

// ═══════════ REVIEW A TASK ═══════════
function renderReview(){
  var att=state.selectedAtt,q=state.selectedQuestion,task=state.selectedTask,u=state.currentUser;
  var backTo=function(){ state.view = state.reviewSource==='history'?'history':'attestation'; render(); };
  var wrap=h('div',{style:{padding:'28px',maxWidth:'800px'}});
  wrap.appendChild(backBtn('Back',backTo));
  if(!att||!q||!task){ wrap.appendChild(emptyCard('Task not found.')); return wrap; }
  var team=state.users.find(function(x){return x.id===task.teamId;});
  var sub=getTaskSub(att.id,q.id,task.id,task.teamId);
  var st=sub?getTaskStatus(att,q,task):'not_started';

  wrap.appendChild(h('p',{style:{fontSize:'11px',color:'var(--faint)',marginBottom:'4px'}},att.name+' · '+q.title));
  var hh=h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'12px',marginBottom:'18px'}});
  hh.appendChild(h('div',{},[ h('h2',{style:{fontSize:'18px',fontWeight:'700',marginBottom:'4px'}},task.title), h('p',{style:{fontSize:'12px',color:'var(--muted)'}},'Assigned to '+(team?team.name:'—')) ]));
  hh.appendChild(taskStatusPill(st));
  wrap.appendChild(hh);
  if(!sub){ wrap.appendChild(emptyCard('This task has not been submitted yet.')); return wrap; }

  // Collapsible section — reviewers can fold any block down to just its title
  function section(headerChildren, bodyChildren, open){
    var card=h('div',{style:{background:'#fff',borderRadius:'14px',border:'1px solid var(--border)',boxShadow:'var(--shadow-sm)',padding:'15px 18px',marginBottom:'14px'}});
    var chev=icon('chevron',16,'#9098A2'); chev.style.transition='transform .15s';
    var titleWrap=h('div',{style:{flex:'1',minWidth:'0',display:'flex',alignItems:'center',gap:'8px'}}, headerChildren);
    var head=h('div',{style:{display:'flex',alignItems:'center',gap:'10px',cursor:'pointer',userSelect:'none'}},[titleWrap, chev]);
    var body=h('div',{style:{marginTop:'13px'}}, bodyChildren);
    var isOpen=open!==false;
    function sync(){ body.style.display=isOpen?'block':'none'; chev.style.transform=isOpen?'rotate(180deg)':'rotate(0deg)'; }
    head.addEventListener('click',function(){ isOpen=!isOpen; sync(); });
    sync();
    card.appendChild(head); card.appendChild(body);
    return card;
  }
  function eyebrow(txt){ return h('span',{style:{fontSize:'10px',fontWeight:'700',color:'var(--muted)',letterSpacing:'.5px'}},txt); }

  // ── Submitted evidence (open) ──
  var evBody=[];
  if(sub.evidence&&sub.evidence.text) evBody.push(h('p',{style:{fontSize:'13px',color:'var(--text)',whiteSpace:'pre-wrap',lineHeight:'1.55'}},sub.evidence.text));
  else evBody.push(h('p',{style:{fontSize:'12px',color:'var(--faint)'}},'No text evidence provided.'));
  if(sub.evidence&&sub.evidence.files&&sub.evidence.files.length){
    var g=h('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'8px',marginTop:'12px'}});
    sub.evidence.files.forEach(function(f){ if(/^data:image/.test(f.data)) g.appendChild(h('img',{src:f.data,style:{width:'100%',height:'66px',objectFit:'cover',borderRadius:'8px',border:'1px solid var(--border)'}})); else g.appendChild(h('div',{style:{height:'66px',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg-sub)',borderRadius:'8px',border:'1px solid var(--border)'}},icon('fileText',20,'#9098A2'))); });
    evBody.push(g);
  } else { evBody.push(h('p',{style:{fontSize:'11px',color:'var(--faint)',marginTop:'8px'}},'(File attachments are not persisted across sessions in this prototype.)')); }
  wrap.appendChild(section([eyebrow('SUBMITTED EVIDENCE')], evBody, true));

  // ── AI compliance check (open) ──
  if(sub.ai){
    var ai=sub.ai;
    var aiHeader=[
      h('div',{style:{flex:'1',minWidth:'0',display:'flex',alignItems:'center',gap:'7px'}},[icon('sparkles',14,'#7A5B00'),eyebrow('AI COMPLIANCE CHECK')]),
      h('span',{style:{display:'inline-flex',alignItems:'center',gap:'6px',fontSize:'12px',fontWeight:'700',color:ai.compliant?'#127A56':'#C0362C'}},[icon(ai.compliant?'check':'alert',15,ai.compliant?'#127A56':'#C0362C'),h('span',{},ai.compliant?'All criteria met':ai.met+'/'+ai.total+' met')])
    ];
    var aiBody=[];
    if(!ai.results.length) aiBody.push(h('p',{style:{fontSize:'12px',color:'var(--faint)'}},'No criteria were defined for this task.'));
    ai.results.forEach(function(rr){ aiBody.push(h('div',{style:{display:'flex',alignItems:'flex-start',gap:'8px',fontSize:'12px',padding:'4px 0',color:rr.met?'#127A56':'var(--muted)'}},[ h('span',{style:{flexShrink:'0',display:'flex',marginTop:'1px'}},icon(rr.met?'check':'x',14,rr.met?'#127A56':'#C0362C')), h('span',{},rr.text+(rr.note&&!rr.met?' — '+rr.note:'')) ])); });
    wrap.appendChild(section(aiHeader, aiBody, true));
  }

  // ── Response history (collapsed by default → shows just the title) ──
  var subdVers=(sub.versions||[]).filter(function(v){return v.status==='submitted';});
  if(sub.versions&&sub.versions.length){
    var histHeader=[
      h('div',{style:{flex:'1',minWidth:'0',display:'flex',alignItems:'center',gap:'7px'}},[icon('history',14,'#646B76'),eyebrow('RESPONSE HISTORY')]),
      h('span',{style:{fontSize:'11px',padding:'1px 7px',borderRadius:'10px',background:'var(--bg-sub)',color:'var(--muted)'}},subdVers.length+' submission'+(subdVers.length!==1?'s':''))
    ];
    var histBody=[];
    if(subdVers.length>=2){
      var prevV=subdVers[subdVers.length-2], lastV=subdVers[subdVers.length-1];
      histBody.push(h('p',{style:{fontSize:'11px',fontWeight:'600',color:'var(--text)',marginBottom:'6px'}},'Changes since the previous submission ('+fmtDate(prevV.savedAt)+')'));
      var diffBox=h('div',{style:{fontSize:'13px',lineHeight:'1.65',whiteSpace:'pre-wrap',background:'var(--bg-sub)',border:'1px solid var(--border)',borderRadius:'8px',padding:'12px'}});
      wordDiff(prevV.text||'',lastV.text||'').forEach(function(tok){
        if(/^\s+$/.test(tok.text)){ diffBox.appendChild(document.createTextNode(tok.text)); return; }
        if(tok.type==='add') diffBox.appendChild(h('span',{style:{background:'#D7F0E3',color:'#0E5C41',borderRadius:'3px',padding:'0 1px'}},tok.text));
        else if(tok.type==='del') diffBox.appendChild(h('span',{style:{color:'#C0362C',textDecoration:'line-through'}},tok.text));
        else diffBox.appendChild(h('span',{style:{color:'var(--text)'}},tok.text));
      });
      histBody.push(diffBox);
      histBody.push(h('div',{style:{display:'flex',gap:'16px',marginTop:'8px',fontSize:'10px',color:'var(--faint)'}},[
        h('span',{style:{display:'inline-flex',alignItems:'center',gap:'5px'}},[h('span',{style:{width:'11px',height:'11px',borderRadius:'2px',background:'#D7F0E3',display:'inline-block'}}),h('span',{},'Added')]),
        h('span',{style:{display:'inline-flex',alignItems:'center',gap:'5px'}},[h('span',{style:{width:'12px',borderTop:'2px solid #C0362C',display:'inline-block'}}),h('span',{},'Removed')])
      ]));
    } else {
      histBody.push(h('p',{style:{fontSize:'12px',color:'var(--faint)'}},'First submission — no previous version to compare.'));
    }
    var tl=h('div',{style:{marginTop:'12px',borderTop:'1px solid var(--border)',paddingTop:'10px'}});
    sub.versions.slice().reverse().forEach(function(v){
      var lab=v.status==='submitted'?'Submitted':v.status==='in_progress'?'Saved draft':v.status;
      var dot=v.status==='submitted'?'#2A5BD7':'#FFC400';
      tl.appendChild(h('div',{className:'tnum',style:{display:'flex',alignItems:'center',gap:'8px',fontSize:'11px',color:'var(--muted)',padding:'3px 0'}},[
        h('span',{style:{width:'6px',height:'6px',borderRadius:'50%',background:dot,flexShrink:'0'}}),
        h('span',{style:{fontWeight:'600',color:'var(--text)'}},'v'+v.vNum),
        h('span',{},lab),
        h('span',{style:{marginLeft:'auto'}},fmtDate(v.savedAt)+' · '+(v.savedBy||'—'))
      ]));
    });
    histBody.push(tl);
    wrap.appendChild(section(histHeader, histBody, false));
  }

  // ── Reviewer decision (open) ──
  if(u.role==='admin'||u.role==='reviewer'){
    var decComment=(sub.review&&sub.review.comments)||'';
    var decBody=[];
    decBody.push(h('label',{style:{fontSize:'11px',fontWeight:'600',color:'var(--muted)',display:'block',marginBottom:'5px'}},[h('span',{},'Comment '),h('span',{style:{color:'#C0362C'}},'*required')]));
    var ta=h('textarea',{style:{width:'100%',height:'64px',border:'1px solid '+(decComment.trim()?'var(--border)':'#E2A8A2'),borderRadius:'8px',padding:'9px 11px',fontSize:'12px',resize:'none',fontFamily:'inherit',outline:'none',boxSizing:'border-box',marginBottom:'10px'},placeholder:'Explain your decision — this is recorded against the task and shown to the team.'});
    ta.value=decComment;
    var btnA=h('button',{style:{display:'inline-flex',alignItems:'center',gap:'6px',padding:'8px 16px',fontSize:'13px',fontWeight:'600',borderRadius:'9px',border:'1.5px solid #127A56',background:'var(--ok-bg)',color:'#127A56'}},[icon('check',15,'#127A56'),h('span',{},'Mark compliant')]);
    var btnB=h('button',{style:{display:'inline-flex',alignItems:'center',gap:'6px',padding:'8px 16px',fontSize:'13px',fontWeight:'600',borderRadius:'9px',border:'1.5px solid #C0362C',background:'var(--danger-bg)',color:'#C0362C'}},[icon('x',15,'#C0362C'),h('span',{},'Send back (needs work)')]);
    function syncBtns(){ var ok=ta.value.trim().length>0; [btnA,btnB].forEach(function(b){ b.disabled=!ok; b.style.opacity=ok?'1':'.45'; b.style.cursor=ok?'pointer':'not-allowed'; }); ta.style.borderColor=ok?'var(--border)':'#E2A8A2'; }
    ta.addEventListener('input',function(){ decComment=this.value; syncBtns(); });
    decBody.push(ta);
    function decide(status){ if(!decComment.trim()){ alert('A reviewer comment is required before you can decide.'); ta.focus(); return; } sub.status=status; sub.review={by:u.name,comments:decComment.trim(),at:new Date().toISOString()}; saveSubmissions(); backTo(); }
    btnA.addEventListener('click',function(){decide('compliant');});
    btnB.addEventListener('click',function(){decide('needs_work');});
    decBody.push(h('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap'}},[btnA,btnB]));
    if(sub.review&&sub.review.by) decBody.unshift(h('div',{style:{background:'var(--bg-sub)',borderRadius:'10px',border:'1px solid var(--border)',padding:'10px 12px',marginBottom:'12px',fontSize:'12px',color:'var(--muted)'}},
      'Last decision by '+sub.review.by+' · '+fmtDate(sub.review.at)+(sub.review.comments?' — '+sub.review.comments:'')));
    wrap.appendChild(section([eyebrow('REVIEWER DECISION')], decBody, true));
    syncBtns();
  }

  return wrap;
}

function escHtml(str) {

function downloadHtml(filename, html) {
  var blob = new Blob([html],{type:'text/html'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href=url; a.download=filename; a.click();
  setTimeout(function(){URL.revokeObjectURL(url);},5000);
}

      qCard.appendChild(qTop);
      var qDesc = h('input',{type:'text',placeholder:'Short description of what this question covers',style:Object.assign({},inputStyle,{marginBottom:'10px',fontSize:'12px'})});
      qDesc.value=q.desc; qDesc.addEventListener('input',function(){q.desc=this.value;});
      qCard.appendChild(qDesc);

      // Tasks within question
      (q.tasks||[]).forEach(function(t, ti) {
        var tCard = h('div',{style:{background:'#fff',border:'1px solid var(--border)',borderRadius:'10px',padding:'12px',marginBottom:'8px'}});
        var tTop = h('div',{style:{display:'flex',gap:'8px',alignItems:'center',marginBottom:'8px'}});
        tTop.appendChild(h('span',{style:{fontSize:'10px',fontWeight:'700',color:'var(--muted)',whiteSpace:'nowrap'}},'Task '+(qi+1)+'.'+(ti+1)));
        var tTitle = h('input',{type:'text',placeholder:'Task title',style:Object.assign({},inputStyle,{flex:'1'})});
        tTitle.value=t.title; tTitle.addEventListener('input',function(){t.title=this.value;});
        tTop.appendChild(tTitle);
        tTop.appendChild(h('button',{style:{display:'inline-flex',alignItems:'center',justifyContent:'center',width:'28px',height:'28px',borderRadius:'7px',border:'none',background:'var(--danger-bg)',color:'#C0362C',cursor:'pointer',flexShrink:'0'},
          onClick:function(){ q.tasks.splice(ti,1); render(); }},icon('x',14,'#C0362C')));
        tCard.appendChild(tTop);

        var tInstr = h('textarea',{placeholder:'Instructions for the crew — what to provide as evidence',style:Object.assign({},inputStyle,{height:'46px',resize:'none',fontSize:'12px',marginBottom:'8px'})});
        tInstr.value=t.instructions; tInstr.addEventListener('input',function(){t.instructions=this.value;});
        tCard.appendChild(tInstr);

        // Assign team + due + required
        var tMeta = h('div',{style:{display:'flex',gap:'10px',alignItems:'center',flexWrap:'wrap',marginBottom:'8px'}});
        var teamSel = h('select',{style:Object.assign({},inputStyle,{width:'auto',flex:'1',minWidth:'150px',fontSize:'12px'})});
        if (!crewUsers.length) teamSel.appendChild(h('option',{value:''},'No teams yet'));
        crewUsers.forEach(function(u){ var o=h('option',{value:u.id},u.name); if(t.teamId===u.id)o.selected=true; teamSel.appendChild(o); });
        teamSel.addEventListener('change',function(){t.teamId=this.value;});
        tMeta.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:'6px'}},[icon('users',14,'#9098A2'),teamSel]));
        var tDue = h('input',{type:'date',style:Object.assign({},inputStyle,{width:'auto',fontSize:'12px'})});
        tDue.value=t.due||''; tDue.addEventListener('change',function(){t.due=this.value||'';});
        tMeta.appendChild(tDue);
        var reqLbl = h('label',{style:{display:'flex',alignItems:'center',gap:'6px',fontSize:'12px',color:'var(--muted)',cursor:'pointer',whiteSpace:'nowrap'}});
        var reqCb = h('input',{type:'checkbox'}); reqCb.checked=t.required!==false; reqCb.addEventListener('change',function(){t.required=this.checked;});
        reqLbl.appendChild(reqCb); reqLbl.appendChild(document.createTextNode('Required'));
        tMeta.appendChild(reqLbl);
        tCard.appendChild(tMeta);

        // Evidence formats
        var evRow = h('div',{style:{display:'flex',gap:'12px',alignItems:'center',marginBottom:'10px',flexWrap:'wrap'}});
        evRow.appendChild(h('span',{style:{fontSize:'11px',fontWeight:'600',color:'var(--muted)'}},'Evidence:'));
        [{v:'text',l:'Text'},{v:'screenshot',l:'Screenshot'},{v:'document',l:'Document'}].forEach(function(ev){
          var lbl = h('label',{style:{display:'flex',alignItems:'center',gap:'5px',fontSize:'12px',color:'var(--text)',cursor:'pointer'}});
          var cb = h('input',{type:'checkbox'}); cb.checked=(t.evidence||[]).indexOf(ev.v)>=0;
          cb.addEventListener('change',function(){ if(!t.evidence)t.evidence=[]; if(this.checked){if(t.evidence.indexOf(ev.v)<0)t.evidence.push(ev.v);} else {t.evidence=t.evidence.filter(function(x){return x!==ev.v;});} });
          lbl.appendChild(cb); lbl.appendChild(document.createTextNode(ev.l));
          evRow.appendChild(lbl);
        });
        tCard.appendChild(evRow);

        // AI compliance criteria
        var critBox = h('div',{style:{borderTop:'1px dashed var(--border-strong)',paddingTop:'10px'}});
        critBox.appendChild(h('p',{style:{display:'flex',alignItems:'center',gap:'6px',fontSize:'10px',fontWeight:'700',color:'var(--accent-deep)',letterSpacing:'.5px',marginBottom:'2px'}},[icon('sparkles',13,'#7A5B00'),h('span',{},'AI COMPLIANCE CHECKLIST')]));
        critBox.appendChild(h('p',{style:{fontSize:'10px',color:'var(--muted)',marginBottom:'8px'}},'Each line is checked against the crew evidence. The task is compliant when all are met.'));
        (t.criteria||[]).forEach(function(c, ci2){
          var cRow = h('div',{style:{display:'flex',gap:'6px',alignItems:'center',marginBottom:'6px',flexWrap:'wrap'}});
          var cTxt = h('input',{type:'text',placeholder:'Criterion — e.g. "States a review date in the last 90 days"',style:Object.assign({},inputStyle,{flex:'2',minWidth:'180px',fontSize:'12px',padding:'6px 9px'})});
          cTxt.value=c.text; cTxt.addEventListener('input',function(){c.text=this.value;});
          cRow.appendChild(cTxt);
          var cSel = h('select',{style:Object.assign({},inputStyle,{width:'auto',fontSize:'11px',padding:'6px 8px'})});
          RULE_TYPES.forEach(function(rt){ var o=h('option',{value:rt.v},rt.l); if(ruleTypeOf(c.rule)===rt.v)o.selected=true; cSel.appendChild(o); });
          cSel.addEventListener('change',function(){
            var v=this.value;
            c.rule = v==='any'?null : v==='keyword'?{type:'keyword',any:[]} : v==='minWords'?{type:'minWords',n:40} : {type:v};
            render();
          });
          cRow.appendChild(cSel);
          if (ruleTypeOf(c.rule)==='keyword') {
            var kp = h('input',{type:'text',placeholder:'keywords, comma-separated',style:Object.assign({},inputStyle,{width:'auto',flex:'1',minWidth:'120px',fontSize:'11px',padding:'6px 8px'})});
            kp.value=(c.rule.any||[]).join(', '); kp.addEventListener('input',function(){c.rule.any=this.value.split(',').map(function(s){return s.trim();}).filter(Boolean);});
            cRow.appendChild(kp);
          } else if (ruleTypeOf(c.rule)==='minWords') {
            var np = h('input',{type:'number',min:'1',style:Object.assign({},inputStyle,{width:'70px',fontSize:'11px',padding:'6px 8px'})});
            np.value=c.rule.n||40; np.addEventListener('input',function(){c.rule.n=parseInt(this.value,10)||1;});
            cRow.appendChild(np);
          }
          cRow.appendChild(h('button',{style:{display:'inline-flex',alignItems:'center',justifyContent:'center',width:'24px',height:'24px',borderRadius:'6px',border:'none',background:'var(--danger-bg)',color:'#C0362C',cursor:'pointer',flexShrink:'0'},
            onClick:function(){ t.criteria.splice(ci2,1); render(); }},icon('x',12,'#C0362C')));
          critBox.appendChild(cRow);
        });
        critBox.appendChild(h('button',{style:{display:'inline-flex',alignItems:'center',gap:'5px',fontSize:'11px',color:'var(--accent-deep)',border:'1px dashed #F2DD9A',background:'var(--accent-tint)',borderRadius:'7px',padding:'5px 11px',cursor:'pointer'},
          onClick:function(){ if(!t.criteria)t.criteria=[]; t.criteria.push(freshCriterion()); render(); }},[icon('plus',12,'#7A5B00'),h('span',{},'Add criterion')]));
        tCard.appendChild(critBox);

        qCard.appendChild(tCard);
      });

      qCard.appendChild(h('button',{style:{display:'inline-flex',alignItems:'center',gap:'5px',fontSize:'12px',fontWeight:'500',color:'var(--text)',border:'1px solid var(--border-strong)',background:'#fff',borderRadius:'8px',padding:'6px 12px',cursor:'pointer'},
        onClick:function(){ q.tasks.push(freshTask()); render(); }},[icon('plus',13),h('span',{},'Add task')]));
      form.appendChild(qCard);
    });

    form.appendChild(h('button',{style:{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:'6px',fontSize:'13px',fontWeight:'600',color:'var(--text)',border:'1px dashed var(--border-strong)',background:'var(--bg-sub)',borderRadius:'10px',padding:'10px',cursor:'pointer',width:'100%'},
      onClick:function(){ na.questions.push(freshQuestion()); render(); }},[icon('plus',15),h('span',{},'Add question')]));

    // Save / cancel
    form.appendChild(h('div',{style:{display:'flex',justifyContent:'flex-end',gap:'8px',marginTop:'20px',paddingTop:'16px',borderTop:'1px solid var(--border)'}},[
      h('button',{style:{padding:'9px 16px',fontSize:'13px',border:'1px solid var(--border-strong)',borderRadius:'9px',background:'#fff',color:'#475569',cursor:'pointer'},
        onClick:function(){ state.showCreateAtt=false; state.newAtt={name:'',scheme:'AusPayNet',due:'',desc:'',questions:[]}; state.importFromLastYearId=''; render(); }},'Cancel'),
      h('button',{style:{padding:'9px 20px',fontSize:'13px',fontWeight:'600',border:'none',borderRadius:'9px',background:'var(--accent)',color:'#16181D',cursor:'pointer'},
        onClick:function(){
          if (!na.name.trim()) { alert('Attestation name is required.'); return; }
          var questions = na.questions.map(function(q){
            return {id:q.id,title:(q.title||'').trim()||'Untitled question',desc:(q.desc||'').trim(),
              tasks:(q.tasks||[]).map(function(t){
                return {id:t.id,title:(t.title||'').trim()||'Untitled task',instructions:(t.instructions||'').trim(),
                  teamId:t.teamId||null,evidence:(t.evidence&&t.evidence.length)?t.evidence.slice():['text'],
                  required:t.required!==false,due:t.due||null,
                  criteria:(t.criteria||[]).filter(function(c){return (c.text||'').trim();}).map(function(c){return {id:c.id,text:c.text.trim(),rule:c.rule||null};})};
              })};
          });
          var newAtt = {id:'a-'+Date.now(),name:na.name.trim(),scheme:na.scheme,due:na.due,desc:na.desc.trim(),questions:questions};
          state.attestations.push(newAtt);
          teamsForAtt(newAtt).forEach(function(uid){ var u=state.users.find(function(x){return x.id===uid;}); if(u&&u.atts.indexOf(newAtt.id)<0)u.atts.push(newAtt.id); });
          saveAttestations(); saveUsers();
          state.newAtt={name:'',scheme:'AusPayNet',due:'',desc:'',questions:[]}; state.newTeamName=''; state.importFromLastYearId='';
          state.showCreateAtt=false; render();
        }
      },'Create Attestation')
    ]));
    wrap.appendChild(form);
  }

  // ── Existing attestations ──
  state.attestations.forEach(function(att) {
    var card = h('div',{style:{background:'#fff',borderRadius:'14px',border:'1px solid var(--border)',boxShadow:'var(--shadow-sm)',padding:'18px',marginBottom:'14px'}});
    var schemeC = att.scheme==='AP+'?{bg:'#F5EEFE',c:'#7c3aed',b:'#E4D7FB'}:{bg:'#E8EEFC',c:'#2A5BD7',b:'#CBDAF7'};
    var tasksN = attTasks(att).length;
    var teamN = teamsForAtt(att).length;
    card.appendChild(h('span',{style:{fontSize:'11px',padding:'2px 9px',borderRadius:'20px',background:schemeC.bg,color:schemeC.c,border:'1px solid '+schemeC.b,fontWeight:'600'}},att.scheme));
    card.appendChild(h('p',{style:{fontWeight:'600',fontSize:'15px',color:'var(--text)',marginTop:'8px'}},att.name));
    card.appendChild(h('p',{className:'tnum',style:{fontSize:'11px',color:'var(--faint)',marginTop:'2px'}},'Due '+fmtDate(att.due)+' · '+(att.questions||[]).length+' questions · '+tasksN+' tasks · '+teamN+' team'+(teamN!==1?'s':'')));

    var details = h('div',{style:{marginTop:'14px',paddingTop:'12px',borderTop:'1px solid var(--border)'}});
    (att.questions||[]).forEach(function(q, qi){
      details.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:'8px',fontSize:'12px',fontWeight:'600',color:'var(--text)',marginTop:qi?'10px':'0',marginBottom:'4px'}},[
        h('span',{style:{display:'flex',alignItems:'center',justifyContent:'center',width:'20px',height:'20px',borderRadius:'6px',background:'var(--ink)',color:'var(--accent)',fontSize:'9px',fontWeight:'700',flexShrink:'0'}},'Q'+(qi+1)),
        h('span',{},q.title)
      ]));
      (q.tasks||[]).forEach(function(t){
        var team = state.users.find(function(u){return u.id===t.teamId;});
        details.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:'8px',fontSize:'12px',padding:'3px 0 3px 28px',color:'var(--muted)'}},[
          h('span',{style:{flexShrink:'0',display:'flex'}},icon('clipboard',13,'#B7BCC4')),
          h('span',{style:{flex:'1',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},t.title),
          (t.criteria&&t.criteria.length)?h('span',{style:{display:'inline-flex',alignItems:'center',gap:'4px',fontSize:'10px',color:'var(--accent-deep)',flexShrink:'0'}},[icon('sparkles',11,'#7A5B00'),h('span',{},String(t.criteria.length))]):null,
          h('span',{style:{fontSize:'10px',color:'var(--faint)',flexShrink:'0'}},team?team.name:'Unassigned')
        ]));
      });
    });
    card.appendChild(details);

    var exportFoot = h('div',{style:{marginTop:'14px',paddingTop:'12px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'flex-end'}});
    exportFoot.appendChild(h('button',{style:{display:'inline-flex',alignItems:'center',gap:'7px',padding:'8px 14px',fontSize:'12px',fontWeight:'600',border:'1px solid #F2DD9A',borderRadius:'9px',background:'var(--accent-tint)',color:'var(--accent-deep)',cursor:'pointer'},
      onClick:(function(a){return function(){exportFinalAttestationDoc(a);};})(att)
    },[icon('fileText',15),h('span',{},'Export Final Document')]));
    card.appendChild(exportFoot);
    wrap.appendChild(card);
  });
  return wrap;
}

// Boot
initState();
render();
</script>
</body>
</html>
